<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>감염성 홍반 보호자 Q&A</title><style>  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }    html, body {    height: 100%;    overflow: hidden;  }    body {    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;    background: #abc1d1;    display: flex;    justify-content: center;    /* iOS Safari 대응 */    height: 100vh;    height: 100dvh;  }  .phone {    width: 100%;    max-width: 480px;    height: 100vh;    height: 100dvh;    background: #b2c7d9;    display: flex;    flex-direction: column;    position: relative;    overflow: hidden;  }  /* 헤더 - 고정 높이 */  .header {    background: #b2c7d9;    padding: 12px 16px;    display: flex;    align-items: center;    border-bottom: 1px solid rgba(0,0,0,0.05);    flex-shrink: 0;  }  .back { font-size: 22px; color: #333; margin-right: 12px; }  .header-info { flex: 1; min-width: 0; }  .header-name { font-size: 15px; font-weight: 600; color: #222; }  .header-sub { font-size: 11px; color: #666; margin-top: 2px; }  .header-icons { font-size: 18px; color: #555; letter-spacing: 8px; }  /* 채팅 영역 - flex로 남은 공간 차지 */  .chat {    flex: 1 1 auto;    overflow-y: auto;    -webkit-overflow-scrolling: touch;    padding: 14px 10px;    min-height: 0; /* flex 자식 스크롤 핵심 */  }  .date-divider { text-align: center; margin: 10px 0 14px; }  .date-divider span {    background: rgba(0,0,0,0.15);    color: #fff;    font-size: 11px;    padding: 4px 12px;    border-radius: 12px;  }  .section-divider { text-align: center; margin: 16px 0 8px; }  .section-divider span {    background: rgba(255,255,255,0.7);    color: #2a5f8f;    font-size: 13px;    font-weight: 700;    padding: 6px 16px;    border-radius: 14px;  }  .msg-row {    display: flex;    margin-bottom: 6px;    align-items: flex-end;    animation: fadeIn 0.3s ease;  }  @keyframes fadeIn {    from { opacity: 0; transform: translateY(8px); }    to { opacity: 1; transform: translateY(0); }  }  .msg-row.left { justify-content: flex-start; }  .msg-row.right { justify-content: flex-end; }  .avatar {    width: 36px; height: 36px;    border-radius: 13px;    background: linear-gradient(135deg, #ff9a9e, #fad0c4);    margin-right: 6px;    display: flex;    align-items: center;    justify-content: center;    font-size: 19px;    flex-shrink: 0;    align-self: flex-start;    margin-top: 4px;  }  .msg-content { max-width: 75%; display: flex; flex-direction: column; }  .sender-name {    font-size: 11.5px;    color: #333;    margin-bottom: 3px;    margin-left: 2px;  }  .bubble-wrap { display: flex; align-items: flex-end; gap: 4px; }  .msg-row.right .bubble-wrap { flex-direction: row-reverse; }  .bubble {    padding: 8px 12px;    border-radius: 14px;    font-size: 14px;    line-height: 1.5;    word-break: break-word;    white-space: pre-wrap;  }  .bubble.left { background: #fff; color: #111; border-top-left-radius: 4px; }  .bubble.right { background: #fef01b; color: #111; border-top-right-radius: 4px; }  .bubble.image-bubble {    padding: 4px;    background: #fff;    overflow: hidden;    max-width: 240px;  }  .bubble.image-bubble img {    width: 100%;    border-radius: 10px;    display: block;    cursor: pointer;  }  .bubble.image-bubble .caption {    font-size: 11px;    color: #666;    padding: 5px 7px 3px;    line-height: 1.4;  }  .img-loading {    width: 220px; height: 150px;    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);    background-size: 200% 100%;    animation: shimmer 1.5s infinite;    border-radius: 10px;    display: flex;    align-items: center;    justify-content: center;    color: #999;    font-size: 12px;  }  @keyframes shimmer {    0% { background-position: 200% 0; }    100% { background-position: -200% 0; }  }  .img-modal {    position: fixed;    inset: 0;    background: rgba(0,0,0,0.9);    display: none;    align-items: center;    justify-content: center;    z-index: 200;    padding: 20px;  }  .img-modal.show { display: flex; }  .img-modal img { max-width: 100%; max-height: 90vh; border-radius: 8px; }  .img-modal .close-btn {    position: absolute;    top: 20px; right: 20px;    color: white;    font-size: 28px;    background: rgba(0,0,0,0.5);    width: 40px; height: 40px;    border-radius: 50%;    display: flex;    align-items: center;    justify-content: center;    cursor: pointer;  }  .time { font-size: 10px; color: #555; white-space: nowrap; }  .typing {    display: inline-flex;    align-items: center;    gap: 4px;    padding: 10px 12px;  }  .typing span {    width: 7px; height: 7px;    border-radius: 50%;    background: #999;    animation: typing 1.2s infinite;  }  .typing span:nth-child(2) { animation-delay: 0.2s; }  .typing span:nth-child(3) { animation-delay: 0.4s; }  @keyframes typing {    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }    30% { transform: translateY(-5px); opacity: 1; }  }  /* 입력바 - 고정 높이 */  .input-bar {    background: #f7f7f7;    padding: 6px 10px;    display: flex;    align-items: center;    gap: 8px;    border-top: 1px solid #ddd;    flex-shrink: 0;  }  .plus-btn {    width: 30px; height: 30px;    border-radius: 50%;    background: #e0e0e0;    display: flex; align-items: center; justify-content: center;    font-size: 19px; color: #666;    flex-shrink: 0;  }  .input-area {    flex: 1;    background: white;    border-radius: 18px;    padding: 7px 13px;    font-size: 12.5px;    color: #999;    user-select: none;    border: 1px solid #e0e0e0;  }  /* 카테고리 버튼 영역 - 항상 보임, 스크롤 가능 */  .category-bar {    background: #f0f0f0;    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));    display: flex;    flex-wrap: wrap;    gap: 5px;    border-top: 1px solid #ddd;    flex-shrink: 0;    justify-content: center;    max-height: 130px;    overflow-y: auto;    -webkit-overflow-scrolling: touch;  }  .cat-btn {    background: white;    border: 1.5px solid #b2c7d9;    color: #2a5f8f;    padding: 7px 11px;    border-radius: 16px;    font-size: 12px;    font-weight: 600;    cursor: pointer;    transition: all 0.2s;    flex: 0 0 auto;    white-space: nowrap;  }  .cat-btn:active { transform: scale(0.95); }  .cat-btn.done {    background: #e0e0e0;    color: #999;    border-color: #ccc;  }  .start-overlay {    position: absolute;    inset: 0;    background: rgba(0,0,0,0.85);    color: white;    display: flex;    flex-direction: column;    justify-content: center;    align-items: center;    z-index: 100;    padding: 30px;    text-align: center;  }  .start-overlay h1 { font-size: 26px; margin-bottom: 14px; }  .start-overlay p { font-size: 14px; line-height: 1.7; opacity: 0.9; margin-bottom: 30px; }  .start-btn {    background: #fef01b;    color: #222;    padding: 14px 36px;    border-radius: 24px;    font-size: 16px;    font-weight: 700;    border: none;    cursor: pointer;  }  .start-overlay.hidden { display: none; }  .end-msg {    text-align: center;    color: #2a5f8f;    font-size: 13px;    padding: 16px;    background: rgba(255,255,255,0.6);    border-radius: 12px;    margin: 16px 8px;    line-height: 1.7;    font-weight: 500;  }  .chat::-webkit-scrollbar,  .category-bar::-webkit-scrollbar { width: 0; height: 0; }  /* 작은 화면(아이폰 SE 등) 대응 */  @media (max-height: 700px) {    .header { padding: 10px 14px; }    .header-name { font-size: 14px; }    .input-bar { padding: 5px 10px; }    .input-area { font-size: 12px; padding: 6px 12px; }    .category-bar { max-height: 100px; padding: 6px 6px; }    .cat-btn { padding: 6px 10px; font-size: 11.5px; }  }</style></head><body><div class="phone">  <div class="start-overlay" id="startOverlay">    <h1>🍎 감염성 홍반 Q&A</h1>    <p>일명 "사과병"<br>보호자들이 가장 많이 묻는 질문<br><br>아래 버튼을 눌러<br>궁금한 내용을 확인해보세요</p>    <button class="start-btn" onclick="startChat()">상담 시작하기</button>  </div>  <div class="header">    <div class="back">&lt;</div>    <div class="header-info">      <div class="header-name">소아과 선생님 👨‍⚕️</div>      <div class="header-sub">감염성 홍반(사과병) 안내</div>    </div>    <div class="header-icons">⌕ ☰</div>  </div>  <div class="chat" id="chat">    <div class="date-divider"><span>보호자 상담</span></div>  </div>  <div class="input-bar">    <div class="plus-btn">+</div>    <div class="input-area">아래 버튼을 눌러 질문하세요 👇</div>  </div>  <div class="category-bar" id="categoryBar"></div></div><div class="img-modal" id="imgModal" onclick="closeModal()">  <div class="close-btn">✕</div>  <img id="modalImg" src="" alt=""></div><script>const categories = [  {    id: 'cause', label: '원인', icon: '🦠',    messages: [      { type: 'user', text: '선생님, 감염성 홍반이 뭔가요? 원인이 뭐예요?' },      { type: 'doc', text: '안녕하세요 어머님 😊\n감염성 홍반은 흔히 "사과병" 또는 "다섯번째병"이라고 불러요' },      { type: 'doc', text: '원인은 파보바이러스 B19(Parvovirus B19)라는 바이러스입니다' },      { type: 'doc', text: '⚠️ 참고로 사람한테만 감염되는 바이러스라서\n강아지·고양이의 파보바이러스와는 전혀 다른 종류예요!\n반려동물은 걱정 안 하셔도 됩니다 🐶🐱' },      { type: 'doc', text: '주로 늦겨울~초여름에 유행하고\n4~10세 학령기 아이들에서 가장 많아요' }    ]  },  {    id: 'transmission', label: '전염경로', icon: '😷',    messages: [      { type: 'user', text: '어떻게 옮는 건가요?' },      { type: 'doc', text: '주로 비말 감염이에요\n기침이나 재채기를 통해 전파됩니다' },      { type: 'doc', text: '그 외에도\n• 침이 묻은 장난감/물건을 통한 접촉\n• 임신부 → 태아 (드물게)\n• 수혈 (매우 드물게)\n으로 전파될 수 있어요' },      { type: 'doc', text: '💡 핵심은 손씻기와 기침예절이에요!' }    ]  },  {    id: 'incubation', label: '잠복기', icon: '⏰',    messages: [      { type: 'user', text: '잠복기는 얼마나 되나요?' },      { type: 'doc', text: '바이러스에 노출된 후\n약 4~14일 (평균 1~2주)\n후에 증상이 나타나요' },      { type: 'doc', text: '일부 아이들은 최대 21일까지\n잠복기가 길어지기도 합니다' },      { type: 'doc', text: '그래서 어린이집/유치원에서 한 명 걸리면\n2~3주 뒤에 다른 아이가 발진이 나오는 경우가 흔해요' }    ]  },  {    id: 'symptom', label: '증상', icon: '🤒',    messages: [      { type: 'user', text: '어떤 증상이 나타나요? 사진으로 보여주실 수 있나요?' },      { type: 'doc', text: '네, 사진과 함께 설명드릴게요 📸\n증상은 보통 3단계로 진행됩니다' },      { type: 'doc', text: '【1단계】 전구기 (발진 1주일 전쯤)\n• 미열, 콧물, 두통\n• 인후통, 근육통\n• 그냥 가벼운 감기처럼 보여요' },      { type: 'doc', text: '【2단계】 얼굴 발진기 🍎\n양쪽 뺨이 빨갛게!\n"따귀 맞은 듯한" 발진이 특징이에요' },      { type: 'image', src: 'https://www.cdc.gov/parvovirus-b19/media/images/2024/05/Parvovirus-B19-Slapped-Cheek-Rash.jpg', caption: '📷 양쪽 뺨의 "사과 빰" 발진 (출처: CDC)' },      { type: 'doc', text: '보시면 양쪽 뺨이 빨갛고\n입 주변은 하얗게 보이죠?\n이게 가장 특징적인 모습이에요\n👉 그래서 "사과병"이라고 불러요' },      { type: 'doc', text: '【3단계】 몸통·사지 발진기\n1~4일 뒤 팔, 다리, 몸통으로 확산되고\n레이스 모양(망상형)의 분홍 발진이 나타나요' },      { type: 'image', src: 'https://litfl.com/wp-content/uploads/2022/03/Erythema-infectiosum-fifth-disease-2-1024x316.png', caption: '📷 얼굴 + 팔다리 발진 진행 모습 (출처: LITFL)' },      { type: 'image', src: 'https://i0.wp.com/obgynkey.com/wp-content/uploads/2018/12/m_p9780071767019-ch112_f002.png', caption: '📷 팔의 레이스 모양(망상형) 발진' },      { type: 'doc', text: '팔다리에 그물·레이스 같은 무늬 보이시죠?\n가려움증이 동반될 수 있어요\n이미지를 탭하면 크게 볼 수 있어요 👆' }    ]  },  {    id: 'duration', label: '지속기간', icon: '📅',    messages: [      { type: 'user', text: '발진은 얼마나 가나요?' },      { type: 'doc', text: '얼굴 발진: 4~5일 내 사라져요\n몸통·사지 발진: 1~3주까지 지속될 수 있어요' },      { type: 'doc', text: '⚠️ 중요!\n발진이 사라진 뒤에도 다음 상황에서\n다시 진해 보일 수 있어요\n\n• 햇빛 노출\n• 더운 환경\n• 목욕 후\n• 운동 후\n• 스트레스' },      { type: 'doc', text: '이건 정상적인 경과예요 👌\n재발한 게 아니니까 걱정 마세요!' }    ]  },  {    id: 'isolation', label: '격리/등원', icon: '🏫',    messages: [      { type: 'user', text: '어린이집 보내도 되나요? 격리해야 하나요?' },      { type: 'doc', text: '결론부터 말씀드리면\n발진이 나왔을 땐 이미 전염력이 거의 없어요!' },      { type: 'doc', text: '전염력이 가장 강한 시기는\n👉 발진 나타나기 1주일 전 (전구기)\n\n발진을 보고 진단됐을 땐\n이미 전염 시기가 지난 거예요' },      { type: 'doc', text: '✅ 등원/등교 가능 조건\n• 열이 없고\n• 컨디션이 괜찮으면 OK\n\n법정감염병에도 포함되지 않아서\n등교중지 대상이 아닙니다' },      { type: 'doc', text: '🚨 단, 아래 분들과의 접촉은 피해주세요\n• 임신부\n• 면역저하자\n• 만성 빈혈 환자\n  (겸상적혈구병 등)' }    ]  },  {    id: 'treatment', label: '치료', icon: '💊',    messages: [      { type: 'user', text: '치료는 어떻게 해요? 약 먹어야 하나요?' },      { type: 'doc', text: '특별한 치료제나 백신은 없어요\n대증치료(증상 완화)가 원칙입니다' },      { type: 'doc', text: '【집에서 할 수 있는 케어】\n• 열이 나면 → 해열제\n  (아세트아미노펜, 이부프로펜)\n• 가려움 심하면 → 항히스타민제\n• 충분한 휴식과 수분 섭취' },      { type: 'doc', text: '대부분 자연 치유됩니다 😊\n그리고 한 번 앓으면\n평생 면역이 생겨요!' }    ]  },  {    id: 'warning', label: '주의사항', icon: '⚠️',    messages: [      { type: 'user', text: '언제 병원에 다시 와야 하나요?' },      { type: 'doc', text: '대부분은 합병증 없이 회복되지만\n아래 경우엔 꼭 진료받으세요!' },      { type: 'doc', text: '🚨 즉시 진료 필요\n• 기존에 빈혈이 있는 아이\n  (일과성 무형성 발증 위험)\n• 면역저하 아동\n• 관절통·관절염 동반\n• 고열 지속\n• 아이가 처지고 창백함\n• 호흡이 가쁨' },      { type: 'doc', text: '🤰 임신부 주의!\n가족 중 감염된 아이가 있다면\n임신부는 산부인과 진료를 받아\n항체 검사를 받으시는 게 좋아요\n\n(특히 임신 20주 이전 감염 시\n드물게 태아 합병증 가능성)' },      { type: 'doc', text: '【예방법】\n백신은 없으므로\n✋ 손 씻기\n🤧 기침 예절\n🥄 개인 물품 분리 사용\n이게 가장 좋은 예방법이에요!' }    ]  }];let currentCategory = null;let messageIndex = 0;let isPlaying = false;const completedCategories = new Set();const chat = document.getElementById('chat');const categoryBar = document.getElementById('categoryBar');function startChat() {  document.getElementById('startOverlay').classList.add('hidden');  renderButtons();  setTimeout(() => {    addDocMessage('안녕하세요 어머님! 👋\n감염성 홍반(사과병)에 대해 궁금하신 점을\n아래 버튼을 눌러 확인해보세요 😊');  }, 400);}function renderButtons() {  categoryBar.innerHTML = '';  categories.forEach(cat => {    const btn = document.createElement('button');    btn.className = 'cat-btn';    if (completedCategories.has(cat.id)) btn.classList.add('done');    btn.innerHTML = `${cat.icon} ${cat.label}`;    btn.onclick = () => selectCategory(cat.id);    categoryBar.appendChild(btn);  });  if (completedCategories.size === categories.length) {    const endBtn = document.createElement('button');    endBtn.className = 'cat-btn';    endBtn.style.background = '#ffd6d6';    endBtn.style.borderColor = '#ff9a9a';    endBtn.style.color = '#a02020';    endBtn.innerHTML = '✨ 상담 종료';    endBtn.onclick = endChat;    categoryBar.appendChild(endBtn);  }}function selectCategory(id) {  if (isPlaying) return;  currentCategory = categories.find(c => c.id === id);  messageIndex = 0;  isPlaying = true;  const div = document.createElement('div');  div.className = 'section-divider';  div.innerHTML = `<span>${currentCategory.icon} ${currentCategory.label}</span>`;  chat.appendChild(div);  scrollDown();  playNext();}function playNext() {  if (!currentCategory || messageIndex >= currentCategory.messages.length) {    isPlaying = false;    completedCategories.add(currentCategory.id);    currentCategory = null;    renderButtons();    return;  }  const msg = currentCategory.messages[messageIndex];  if (msg.type === 'user') {    addUserMessage(msg.text);    messageIndex++;    setTimeout(playNext, 700);  } else if (msg.type === 'image') {    showTyping();    setTimeout(() => {      hideTyping();      addImageMessage(msg.src, msg.caption);      messageIndex++;      setTimeout(playNext, 800);    }, 1100);  } else {    showTyping();    setTimeout(() => {      hideTyping();      addDocMessage(msg.text);      messageIndex++;      setTimeout(playNext, 600);    }, 900);  }}function getTime() {  const now = new Date();  let h = now.getHours();  const m = String(now.getMinutes()).padStart(2, '0');  const ampm = h < 12 ? '오전' : '오후';  h = h % 12 || 12;  return `${ampm} ${h}:${m}`;}function addDocMessage(text) {  const row = document.createElement('div');  row.className = 'msg-row left';  row.innerHTML = `    <div class="avatar">👨‍⚕️</div>    <div class="msg-content">      <div class="sender-name">소아과 선생님</div>      <div class="bubble-wrap">        <div class="bubble left">${text}</div>        <div class="time">${getTime()}</div>      </div>    </div>  `;  chat.appendChild(row);  scrollDown();}function addImageMessage(src, caption) {  const row = document.createElement('div');  row.className = 'msg-row left';  const bubbleId = 'img-' + Date.now();  row.innerHTML = `    <div class="avatar">👨‍⚕️</div>    <div class="msg-content">      <div class="sender-name">소아과 선생님</div>      <div class="bubble-wrap">        <div class="bubble left image-bubble" id="${bubbleId}">          <div class="img-loading">이미지 로딩 중...</div>          ${caption ? `<div class="caption">${caption}</div>` : ''}        </div>        <div class="time">${getTime()}</div>      </div>    </div>  `;  chat.appendChild(row);  scrollDown();  const img = new Image();  img.onload = function() {    const bubble = document.getElementById(bubbleId);    if (bubble) {      const loading = bubble.querySelector('.img-loading');      if (loading) loading.remove();      const imgEl = document.createElement('img');      imgEl.src = src;      imgEl.alt = caption || '의학 사진';      imgEl.onclick = () => openModal(src);      bubble.insertBefore(imgEl, bubble.firstChild);      scrollDown();    }  };  img.onerror = function() {    const bubble = document.getElementById(bubbleId);    if (bubble) {      const loading = bubble.querySelector('.img-loading');      if (loading) {        loading.innerHTML = '⚠️ 이미지를 불러올 수 없습니다<br><a href="' + src + '" target="_blank" style="color:#2a5f8f;font-size:11px;">원본 링크 열기</a>';        loading.style.flexDirection = 'column';        loading.style.textAlign = 'center';        loading.style.padding = '20px';        loading.style.height = 'auto';      }    }  };  img.src = src;}function addUserMessage(text) {  const row = document.createElement('div');  row.className = 'msg-row right';  row.innerHTML = `    <div class="msg-content">      <div class="bubble-wrap">        <div class="time">${getTime()}</div>        <div class="bubble right">${text}</div>      </div>    </div>  `;  chat.appendChild(row);  scrollDown();}function showTyping() {  const row = document.createElement('div');  row.className = 'msg-row left';  row.id = 'typingRow';  row.innerHTML = `    <div class="avatar">👨‍⚕️</div>    <div class="msg-content">      <div class="bubble-wrap">        <div class="bubble left">          <div class="typing"><span></span><span></span><span></span></div>        </div>      </div>    </div>  `;  chat.appendChild(row);  scrollDown();}function hideTyping() {  const t = document.getElementById('typingRow');  if (t) t.remove();}function openModal(src) {  document.getElementById('modalImg').src = src;  document.getElementById('imgModal').classList.add('show');}function closeModal() {  document.getElementById('imgModal').classList.remove('show');}function endChat() {  const div = document.createElement('div');  div.className = 'end-msg';  div.innerHTML = '✨ 상담이 완료되었습니다<br><br>📌 추가 궁금증이 생기시면<br>언제든 진료실로 문의주세요<br><br>아이가 빨리 낫기를 바랍니다 🍀';  chat.appendChild(div);  categoryBar.innerHTML = '';  scrollDown();}function scrollDown() {  setTimeout(() => {    chat.scrollTop = chat.scrollHeight;  }, 50);}</script></body></html>
