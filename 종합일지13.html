<div class="toast" id="toast"></div>
<script>'use strict';
const HEIGHT_CM=167,HEIGHT_M=HEIGHT_CM/100;
const WORKOUT_START=new Date(2026,1,20);
const MEAL_TIMES=[{id:'breakfast',name:'아침',icon:'🌅'},{id:'lunch',name:'점심',icon:'☀️'},{id:'dinner',name:'저녁',icon:'🌙'},{id:'snack',name:'간식',icon:'🍪'}];

// ★ 변경: '오후진료실틈새운동' → '오후운동'
// ★ 호환: 기존 저장 데이터의 구(舊) 명칭을 새 명칭으로 정규화하는 매핑
const SLOT_ALIAS={'오후진료실틈새운동':'오후운동'};
const TIME_SLOTS=['새벽침대운동','오전진료실틈새운동','점심운동','오후운동','저녁운동'];

// 저장된 timeSlot 값을 현재 명칭으로 정규화
function normalizeSlot(slot){return SLOT_ALIAS[slot]||slot;}

const PERIOD_INFO={morning:{label:'오전',icon:'🌅',range:'0~12시',color:'#f39c12'},afternoon:{label:'오후',icon:'☀️',range:'12~18시',color:'#27ae60'},night:{label:'취침전',icon:'🌙',range:'18시~',color:'#2980b9'}};
const PERIOD_LABEL_FULL={morning:'오전(0~12시)',afternoon:'오후(12~18시)',night:'취침전(18시~)'};
const FATIGUE_GRADES=[{min:85,grade:'🟢 최상',color:'#27ae60',advice:'고강도 운동 가능'},{min:70,grade:'🟡 양호',color:'#f39c12',advice:'계획대로 정상 운동'},{min:55,grade:'🟠 주의',color:'#e67e22',advice:'강도 10~20% 낮추세요'},{min:40,grade:'🔴 경고',color:'#e74c3c',advice:'디로딩/가벼운 운동만'},{min:0,grade:'⛔ 위험',color:'#c0392b',advice:'완전 휴식 필요'}];
const AREA_MAX={A:20,B:25,C:30,D:15,E:10};
const AREA_SECTIONS={A:['A1','A2'],B:['B1','B2','B3'],C:['C1','C2','C3'],D:['D1','D2'],E:['E1','E2']};
const AREA_NAMES={A:'😴수면',B:'💓신체',C:'⚡컨디션',D:'🏋️운동',E:'🧠정신'};
let currentDate=new Date();
let healthEditing=false,sleepEditing=false,patientEditing=false,medEditing=false;
let _pendingRestore=null;

// ── 주차 계산 ──
function getWorkoutWeekInfo(d){
  const target=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const start0=new Date(2026,1,20);const week2start=new Date(2026,1,23);
  if(target<start0)return null;
  const week1end=new Date(2026,1,22);
  if(target<=week1end)return{week:1,start:start0,end:week1end,isSpecial:true};
  const diffDays=Math.floor((target-week2start)/(1000*60*60*24));
  const weekIndex=Math.floor(diffDays/7);const weekNum=weekIndex+2;
  const wStart=new Date(week2start);wStart.setDate(wStart.getDate()+weekIndex*7);
  const wEnd=new Date(wStart);wEnd.setDate(wEnd.getDate()+6);
  return{week:weekNum,start:wStart,end:wEnd,isSpecial:false};
}
function getWeekBadgeHtml(d){
  const info=getWorkoutWeekInfo(d);
  if(!info)return`<span class="week-badge"><span style="font-size:11px;opacity:.7">운동시작 전</span></span>`;
  const fmt=dt=>`${dt.getMonth()+1}/${dt.getDate()}`;
  const rangeStr=`${fmt(info.start)}~${fmt(info.end)}${info.isSpecial?' ★특수':''}`;
  return`<span class="week-badge">🏋️ <span class="wk-num">${info.week}주차</span> <span class="wk-range">(${rangeStr})</span></span>`;
}
function getWeekReportRange(d){
  const info=getWorkoutWeekInfo(d);const today=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  let from,to;
  if(!info){from=to=today;}else{from=new Date(info.start);to=today<info.end?today:new Date(info.end);}
  const days=[];const cur=new Date(from);
  while(cur<=to){days.push(formatDate(cur));cur.setDate(cur.getDate()+1);}
  return{from:formatDate(from),to:formatDate(to),days};
}

// ── 유틸 ──
function formatDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getDayStr(d){return['일','월','화','수','목','금','토'][d.getDay()];}
function dateKey(){return formatDate(currentDate);}
function pad2(n){return String(n).padStart(2,'0');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(()=>{t.className='toast';},2200);}

// ── localStorage 헬퍼 ──
function wdGet(k){try{const v=localStorage.getItem('wd_'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function wdSet(k,v){localStorage.setItem('wd_'+k,JSON.stringify(v));}
function getWdLogs(){return wdGet('logs')||{};}
function saveWdLogs(logs){wdSet('logs',logs);}
function getFatigueLogs(){try{const v=localStorage.getItem('fatigue_scores');return v?JSON.parse(v):{};}catch(e){return{};}}
function getDayTypes(){return wdGet('dayTypes')||[];}
function getWeeklyGoals(){return wdGet('weeklyGoals')||{};}
function getMedications(){return wdGet('medications')||[];}
function saveMedications(m){wdSet('medications',m);}
function getDayLog(dk){
  const logs=getWdLogs();if(!dk)dk=dateKey();if(!logs[dk])logs[dk]={};
  const dl=logs[dk];
  if(!dl.exercise||!Array.isArray(dl.exercise))dl.exercise=[];
  if(!dl.stretch||!Array.isArray(dl.stretch))dl.stretch=[];
  if(!dl.food||!Array.isArray(dl.food))dl.food=[];
  if(dl.sleep===undefined)dl.sleep=null;if(dl.patient===undefined)dl.patient=null;
  if(dl.brain===undefined)dl.brain=null;if(dl.drink===undefined)dl.drink=null;
  if(dl.dayType===undefined)dl.dayType=null;
  // ★ 기존 데이터 timeSlot 정규화 (읽기 시점에 메모리상 변환)
  dl.exercise.forEach(l=>{l.timeSlot=normalizeSlot(l.timeSlot);});
  dl.stretch.forEach(l=>{l.timeSlot=normalizeSlot(l.timeSlot);});
  return{logs,dl};
}
function saveDl(logs){saveWdLogs(logs);}

// ── 데이터 파싱 헬퍼 ──
function getBpReadings(dk){const logs=getWdLogs();if(!logs[dk]||!logs[dk].health||!logs[dk].health.bpReadings)return[];return logs[dk].health.bpReadings;}
function getPeriodByHour(h){if(h<12)return'morning';if(h<18)return'afternoon';return'night';}
function groupBpByPeriod(readings){const g={morning:[],afternoon:[],night:[]};readings.forEach(r=>{const p=r.period||(r.time?getPeriodByHour(parseInt(r.time.split(':')[0])):'morning');(g[p]||(g[p]=[])).push(r);});return g;}
function calcAvg(arr){return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):null;}
function getPeriodAvgs(readings){const g=groupBpByPeriod(readings);const avgs={};for(const p of['morning','afternoon','night']){const arr=g[p];if(!arr.length){avgs[p]=null;continue;}const hrArr=arr.filter(r=>r.hr&&r.hr>0).map(r=>r.hr);avgs[p]={sys:calcAvg(arr.map(r=>r.sys)),dia:calcAvg(arr.map(r=>r.dia)),hr:hrArr.length?calcAvg(hrArr):null,count:arr.length};}return avgs;}
function getDayBpAvg(readings){const avgs=getPeriodAvgs(readings);const valid=Object.values(avgs).filter(a=>a!==null);if(!valid.length)return null;const hrValid=valid.filter(a=>a.hr!=null);return{sys:calcAvg(valid.map(a=>a.sys)),dia:calcAvg(valid.map(a=>a.dia)),hr:hrValid.length?calcAvg(hrValid.map(a=>a.hr)):null};}
function getBpStatus(sys,dia){if(sys<90||dia<60)return{label:'저혈압',cls:'st-low',color:'#2980b9'};if(sys<120&&dia<80)return{label:'정상',cls:'st-normal',color:'#1e8449'};if(sys<130&&dia<80)return{label:'주의',cls:'st-elevated',color:'#d35400'};if(sys<140||dia<90)return{label:'고혈압전단계',cls:'st-pre',color:'#ca6f1e'};return{label:'고혈압',cls:'st-high',color:'#c0392b'};}
function getHrStatus(hr){if(!hr||hr<=0)return null;if(hr<50)return{label:'서맥',cls:'hr-brady',color:'#1a6fa0'};if(hr<=60)return{label:'느림',cls:'hr-brady',color:'#2980b9'};if(hr<=100)return{label:'정상',cls:'hr-normal',color:'#1e8449'};if(hr<=120)return{label:'빠름',cls:'hr-fast',color:'#d35400'};return{label:'빈맥',cls:'hr-tachy',color:'#c0392b'};}
function getFatigueGrade(total){for(const g of FATIGUE_GRADES){if(total>=g.min)return g;}return FATIGUE_GRADES[FATIGUE_GRADES.length-1];}
function calcSleepMin(bH,bM,wH,wM){let b=bH*60+bM,w=wH*60+wM;if(w<=b)w+=1440;return w-b;}
function formatSleepDuration(m){const h=Math.floor(m/60),mm=m%60;return mm>0?`${h}시간 ${mm}분`:`${h}시간`;}
function getBrainTopics(dl){if(!dl||!dl.brain||!dl.brain.topics)return[];return dl.brain.topics.map(t=>{if(typeof t==='object'&&t!==null)return{name:t.name||'?',kcal:t.kcal!=null?t.kcal:5};return{name:String(t),kcal:5};});}
function getBrainBurn(dl){return getBrainTopics(dl).reduce((s,x)=>s+x.kcal,0);}
function migrateBrainTopics(dl){if(!dl||!dl.brain||!dl.brain.topics)return;dl.brain.topics=dl.brain.topics.map(t=>{if(typeof t==='string')return{name:t,kcal:5};return t;});}
function getDayTypeById(id){return getDayTypes().find(dt=>dt.id===id)||null;}
function getDayTypeForLog(dl){if(!dl||!dl.dayType)return null;return getDayTypeById(dl.dayType);}
function calcExerciseCal(dl){if(!dl||!Array.isArray(dl.exercise))return 0;return dl.exercise.reduce((s,l)=>s+(l._cal||0)*l.sets,0);}
function calcStretchCal(dl){if(!dl||!Array.isArray(dl.stretch))return 0;return dl.stretch.reduce((s,l)=>s+(l._cal||0)*l.sets,0);}
function calcFoodCal(dl){if(!dl||!Array.isArray(dl.food))return 0;return dl.food.reduce((s,l)=>s+(l._calorie||0)*l.qty,0);}
function calcFoodMacro(dl){const r={p:0,c:0,f:0};if(!dl||!Array.isArray(dl.food))return r;dl.food.forEach(l=>{r.p+=(l._protein||0)*l.qty;r.c+=(l._carb||0)*l.qty;r.f+=(l._fat||0)*l.qty;});return r;}
function calcBMI(w){return w/(HEIGHT_M*HEIGHT_M);}
function calcBFP(w,bf){return(bf/w)*100;}
function getBMICategory(bmi){if(bmi<18.5)return{label:'저체중',cls:'bmi-under'};if(bmi<23)return{label:'정상',cls:'bmi-normal'};if(bmi<25)return{label:'과체중',cls:'bmi-over'};return{label:'비만',cls:'bmi-obese'};}
function getInbodyHistory(){const logs=getWdLogs();const r=[];Object.keys(logs).sort().forEach(k=>{const dl=logs[k];if(!dl||!dl.health)return;const h=dl.health;if(h.weight!=null&&h.bodyFat!=null)r.push({date:k,weight:h.weight,muscle:h.muscle,bodyFat:h.bodyFat,bfp:calcBFP(h.weight,h.bodyFat),bmi:calcBMI(h.weight)});});return r;}
function getPrevHealthDefaults(){const logs=getWdLogs();const dk=dateKey();const keys=Object.keys(logs).sort();let prev=null;for(let i=keys.length-1;i>=0;i--){if(keys[i]<dk&&logs[keys[i]]&&logs[keys[i]].health){prev=logs[keys[i]].health;break;}}const def={weight:73,bodyFat:20.0,muscle:30.0};if(prev){if(prev.weight!=null)def.weight=prev.weight;if(prev.bodyFat!=null)def.bodyFat=prev.bodyFat;if(prev.muscle!=null)def.muscle=prev.muscle;}return def;}
function getPrevSleepDefaults(){const logs=getWdLogs();const dk=dateKey();const def={bedH:23,bedM:0,wakeH:6,wakeM:0};const keys=Object.keys(logs).sort().reverse();for(const k of keys){if(k<dk&&logs[k]&&logs[k].sleep){const s=logs[k].sleep;def.bedH=s.bedH;def.bedM=s.bedM;def.wakeH=s.wakeH;def.wakeM=s.wakeM;break;}}return def;}
function getPrevPatientDefaults(){const logs=getWdLogs();const dk=dateKey();const def={goalMin:80,goalMax:120,actual:0};const keys=Object.keys(logs).sort().reverse();for(const k of keys){if(k<dk&&logs[k]&&logs[k].patient){const p=logs[k].patient;def.goalMin=p.goalMin;def.goalMax=p.goalMax;break;}}return def;}
function getEffectiveGoal(){const goals=getWeeklyGoals();const today=new Date(currentDate.getFullYear(),currentDate.getMonth(),currentDate.getDate());const keys=Object.keys(goals).sort().reverse();for(const k of keys){const d=new Date(k.replace(/-/g,'/'));if(d<=today)return goals[k];}return null;}
function getGoalDiffHtml(cv,gv,lowerBetter){if(cv==null||gv==null)return'';const diff=cv-gv,a=Math.abs(diff);if(a<0.05)return'<span class="gl-diff good">달성!</span>';const isGood=lowerBetter?(diff<0):(diff>0);return`<span class="gl-diff ${isGood?'good':'warn'}">${diff>0?'▲':'▼'}${a<10?a.toFixed(1):Math.round(a)}</span>`;}
function getWeeklyHealthAvg(){const today=new Date(currentDate);const r={weight:[],bpSys:[],bpDia:[],bodyFat:[],muscle:[]};for(let i=0;i<7;i++){const d=new Date(today);d.setDate(d.getDate()-i);const k=formatDate(d);const logs=getWdLogs();const dl=logs[k];if(dl&&dl.health){const h=dl.health;if(h.weight!=null)r.weight.push(h.weight);const avg=getDayBpAvg(getBpReadings(k));if(avg){r.bpSys.push(avg.sys);r.bpDia.push(avg.dia);}else if(h.bpSys!=null){r.bpSys.push(h.bpSys);r.bpDia.push(h.bpDia);}if(h.bodyFat!=null)r.bodyFat.push(h.bodyFat);if(h.muscle!=null)r.muscle.push(h.muscle);}}const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;return{weight:{avg:avg(r.weight),count:r.weight.length},bpSys:{avg:avg(r.bpSys),count:r.bpSys.length},bpDia:{avg:avg(r.bpDia),count:r.bpDia.length},bodyFat:{avg:avg(r.bodyFat),count:r.bodyFat.length},muscle:{avg:avg(r.muscle),count:r.muscle.length}};}
function getTrendIcon(cv,av){if(cv==null||av==null)return'';const d=cv-av,a=Math.abs(d);if(a<0.05)return'<span class="wa-trend same">→</span>';return d>0?`<span class="wa-trend up">▲${a<10?a.toFixed(1):Math.round(a)}</span>`:`<span class="wa-trend down">▼${a<10?a.toFixed(1):Math.round(a)}</span>`;}
function getBmrConfig(){try{return wdGet('bmrConfig')||{baseBmr:1550,kcalPerPatient:3};}catch(e){return{baseBmr:1550,kcalPerPatient:3};}}
function getActiveMeds(dk){return getMedications().filter(m=>{if(m.addedDate&&m.addedDate>dk)return false;if(m.removedDate&&m.removedDate<=dk)return false;return true;});}

// ── 날짜 네비 ──
function changeDate(n){currentDate.setDate(currentDate.getDate()+n);healthEditing=false;sleepEditing=false;patientEditing=false;medEditing=false;renderAll();}
function goToday(){currentDate=new Date();healthEditing=false;sleepEditing=false;patientEditing=false;medEditing=false;renderAll();}

// ── 스피너 헬퍼 ──
function spinVal(id,delta,min,max){const el=document.getElementById(id);if(!el)return;let v=parseFloat(el.value)||0;v=Math.round((v+delta)*100)/100;if(min!=null)v=Math.max(min,v);if(max!=null)v=Math.min(max,v);el.value=v;}
function spinTime(id,d){const el=document.getElementById(id);if(!el)return;let v=(parseInt(el.value)||0)+d;el.value=id.endsWith('H')?((v%24)+24)%24:((v%60)+60)%60;updateSleepPreview();}
function spinPat(id,d){const el=document.getElementById(id);if(!el)return;el.value=Math.max(0,Math.min(500,(parseInt(el.value)||0)+d));}
function spinNap(d){const el=document.getElementById('napHours');if(!el)return;el.value=Math.max(0,Math.min(12,Math.round(((parseFloat(el.value)||0)+d)*2)/2));}
function spinDrink(type,d){const{logs,dl}=getDayLog();if(!dl.drink)dl.drink={soju:0,beer:0};dl.drink[type]=Math.max(0,Math.round((dl.drink[type]+d)*2)/2);saveDl(logs);renderDrinkCard();renderSummaryCard();}

// ── 연동 배너 ──
function renderLinkBanner(){
  const wdLogs=getWdLogs(),fatLogs=getFatigueLogs();

  if(wdCount>0&&fatCount>0){html=`<div class="link-banner ok"><span class="lb-icon">🔗</span><span>운동일지 <b>${wdCount}일</b> · 피로도 <b>${fatCount}일</b> 연동됨</span></div>`;}
  else if(wdCount>0){html=`<div class="link-banner ok"><span class="lb-icon">🔗</span><span>운동일지 <b>${wdCount}일</b> 연동됨 | 피로도 데이터 없음</span></div>`;}
  else{html=`<div class="link-banner warn"><span class="lb-icon">⚠️</span><span>같은 브라우저에서 운동기록8.html · 혈압기록2.html · 피로도.html을 열어야 연동됩니다.</span></div>`;}
  document.getElementById('linkBanner').innerHTML=html;
}
function renderWeekBadge(){document.getElementById('weekBadgeWrap').innerHTML=getWeekBadgeHtml(currentDate);}

// ── 피로도 배너 ──
function renderScoreBanner(){
  const fatLogs=getFatigueLogs();const dk=dateKey();const saved=fatLogs[dk];
  const wrap=document.getElementById('scoreBanner');
  if(!saved){wrap.innerHTML=`<div style="margin:10px;background:linear-gradient(135deg,#1a1a2e,#0f3460);border-radius:16px;padding:14px 16px;color:rgba(255,255,255,.55);font-size:13px;text-align:center">🔋 오늘의 피로도 점수 없음<br><span style="font-size:11px">피로도 앱에서 평가를 완료하세요</span></div>`;return;}

function generateWeeklyReport(){

  let tBurnAll=0,tInAll=0,exDays=0,slMins=[],scores=[];

function snapshotLocalStorage(){
  const snap={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    try{snap[k]=JSON.parse(localStorage.getItem(k));}
    catch(e){snap[k]=localStorage.getItem(k);}
  }
  return snap;
}
function analyzeSnapshot(snap){
  const keys=Object.keys(snap);
  const wdLogs=snap['wd_logs']||{};
  const fatLogs=snap['fatigue_scores']||{};
  const logDays=Object.keys(wdLogs).length;
  const fatDays=Object.keys(fatLogs).length;
  const meds=(snap['wd_medications']||[]).length;
  const dayTypes=(snap['wd_dayTypes']||[]).length;
  const totalBytes=JSON.stringify(snap).length;
  const logKeys=keys.filter(k=>k.startsWith('wd_')||k==='fatigue_scores');
  return{keys:keys.length,logKeys:logKeys.length,logDays,fatDays,meds,dayTypes,totalBytes};
}

    data:snap
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  saveBackupLog({type:'export',filename,ts:now.toISOString(),size:blob.size});
  showToast(`✅ 백업 다운로드 완료!\n${filename}`);
  renderBackupPanel();
}
function importBackup(event,mode){
  const file=event.target.files[0];if(!file){return;}
  event.target.value='';
  const reader=new FileReader();
  reader.onload=function(e){
    let payload;
    try{payload=JSON.parse(e.target.result);}
    catch(err){showWarn('❌ JSON 파싱 오류: 올바른 백업 파일이 아닙니다.');return;}
    let snap;
    if(payload.data&&payload._meta){snap=payload.data;}
    else if(typeof payload==='object'&&!Array.isArray(payload)){snap=payload;}
    else{showWarn('❌ 지원하지 않는 파일 형식입니다.');return;}
    const info=analyzeSnapshot(snap);
    const meta=payload._meta||{};
    _pendingRestore={snap,mode};
    const prev=document.getElementById('restorePreview');
    prev.innerHTML=`
      <div style="font-weight:700;margin-bottom:6px;font-size:12px">📂 불러온 파일 정보</div>
      ${meta.exportedAtKr?`<div>📅 백업일시: ${meta.exportedAtKr}</div>`:''}
      <div>📦 총 키: ${info.keys}개</div>
      <div>📋 일지 데이터: ${info.logDays}일 · 피로도: ${info.fatDays}일</div>
      <div>💊 투약: ${info.meds}종 · 유형: ${info.dayTypes}개</div>
      <div>💾 파일크기: ${(info.totalBytes/1024).toFixed(1)} KB</div>
      <div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.15);font-weight:700;color:${mode==='overwrite'?'#e74c3c':'#f9ca24'}">
        ${mode==='overwrite'?'⚠️ 덮어쓰기: 현재 데이터가 완전히 교체됩니다':'🔀 병합: 기존 데이터에 추가/덮어씁니다 (키 단위)'}
      </div>`;
    prev.classList.add('show');
    showWarn(mode==='overwrite'
      ?'⚠️ 현재 저장된 모든 데이터가 백업 파일로 교체됩니다. 계속하시겠습니까?'
      :'🔀 백업 파일의 키를 현재 데이터에 병합합니다. 같은 키는 덮어씌워집니다.');
    document.getElementById('bkConfirmRow').classList.add('show');
    document.getElementById('bkConfirmBtn').textContent=mode==='overwrite'?'✅ 확인 — 덮어쓰기 복원':'✅ 확인 — 병합 복원';
  };
  reader.readAsText(file);
}
function executeRestore(){
  if(!_pendingRestore){cancelRestore();return;}
  const{snap,mode}=_pendingRestore;
  if(mode==='overwrite'){
    localStorage.clear();
    Object.keys(snap).forEach(k=>{try{localStorage.setItem(k,typeof snap[k]==='string'?snap[k]:JSON.stringify(snap[k]));}catch(e){console.warn('복원 실패 키:',k,e);}});
    saveBackupLog({type:'restore-overwrite',ts:new Date().toISOString(),keys:Object.keys(snap).length});
    showToast('✅ 전체 복원 완료!');
  }else{
    let count=0;
    Object.keys(snap).forEach(k=>{try{localStorage.setItem(k,typeof snap[k]==='string'?snap[k]:JSON.stringify(snap[k]));count++;}catch(e){console.warn('병합 실패 키:',k,e);}});
    saveBackupLog({type:'restore-merge',ts:new Date().toISOString(),keys:count});
    showToast(`🔀 병합 완료! ${count}개 키 적용됨`);
  }
  cancelRestore();renderAll();renderBackupPanel();
}
function cancelRestore(){
  _pendingRestore=null;
  document.getElementById('restorePreview').classList.remove('show');
  document.getElementById('bkWarn').classList.remove('show');
  document.getElementById('bkConfirmRow').classList.remove('show');
}
function showWarn(msg){const el=document.getElementById('bkWarn');el.textContent=msg;el.classList.add('show');}
function confirmClearAll(){

function executeClearAll(){
  localStorage.clear();
  saveBackupLog({type:'clear-all',ts:new Date().toISOString()});
  cancelRestore();
  document.getElementById('bkConfirmBtn').onclick=executeRestore;
  showToast('🗑️ 전체 초기화 완료');
  renderAll();renderBackupPanel();
}
function saveBackupLog(entry){
  try{const logs=JSON.parse(localStorage.getItem('_bk_log')||'[]');logs.unshift(entry);if(logs.length>20)logs.length=20;localStorage.setItem('_bk_log',JSON.stringify(logs));}catch(e){}
}
function renderBackupPanel(){
  const snap=snapshotLocalStorage();
  const info=analyzeSnapshot(snap);
  const lastBk=function(){try{const logs=JSON.parse(localStorage.getItem('_bk_log')||'[]');return logs.find(l=>l.type==='export');}catch(e){return null;}}();

    <div class="bk-stat"><span class="bk-stat-label">🕐 최근 백업</span><span class="bk-stat-val">${lastBk?new Date(lastBk.ts).toLocaleString('ko-KR'):'없음'}</span></div>`;
  let logHtml='';
  try{
    const bkLogs=JSON.parse(localStorage.getItem('_bk_log')||'[]');
    if(!bkLogs.length){logHtml=`<div class="empty-msg" style="color:#bbb">백업 이력 없음</div>`;}
    else{
      const typeLabel={'export':'⬇️ 백업 다운로드','restore-overwrite':'✅ 덮어쓰기 복원','restore-merge':'🔀 병합 복원','clear-all':'🗑️ 전체 초기화'};
      const typeColor={'export':'#27ae60','restore-overwrite':'#2980b9','restore-merge':'#8e44ad','clear-all':'#e74c3c'};
      bkLogs.forEach(l=>{
        const color=typeColor[l.type]||'#888';const label=typeLabel[l.type]||l.type;
        const dt=new Date(l.ts).toLocaleString('ko-KR');const extra=l.filename?` · ${l.filename}`:l.keys?` · ${l.keys}키`:'';
        logHtml+=`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:12px"><span style="color:${color};font-weight:700;min-width:110px">${label}</span><span style="color:#888;flex:1">${dt}${extra}</span></div>`;
      });
    }
  }catch(e){logHtml=`<div class="empty-msg">이력 로드 오류</div>`;}
  document.getElementById('backupLogList').innerHTML=logHtml;
}

function renderExerciseCard(){
  const dk=dateKey();const{logs,dl}=getDayLog();
  const exercise=Array.isArray(dl.exercise)?dl.exercise:[];const stretch=Array.isArray(dl.stretch)?dl.stretch:[];
  let html=`<div class="card-title">💪 운동 · 스트레칭 기록</div>`;
  if(!exercise.length&&!stretch.length){html+=`<div class="empty-msg">운동 기록 없음<br><span style="font-size:11px">운동기록8.html에서 입력하세요</span></div>`;document.getElementById('exerciseCard').innerHTML=html;return;}
  if(exercise.length){html+=`<div class="section-divider">💪 운동 — ${calcExerciseCal(dl)}kcal</div>`;const g={};exercise.forEach(l=>{if(!g[l.timeSlot])g[l.timeSlot]=[];g[l.timeSlot].push(l);});for(const ts of TIME_SLOTS){if(!g[ts])continue;html+=`<div class="ex-group-header">⏰ ${ts}</div>`;g[ts].forEach(l=>{html+=`<div class="ex-log-item"><span class="el-name">${l._name||'?'}</span><span class="el-detail">${l._detail||''}</span><span class="el-sets">${l.sets}세트</span><span class="el-cal">${(l._cal||0)*l.sets}kcal</span></div>`;});}}
  if(stretch.length){html+=`<div class="section-divider">🧘 스트레칭 — ${calcStretchCal(dl)}kcal</div>`;const g={};stretch.forEach(l=>{if(!g[l.timeSlot])g[l.timeSlot]=[];g[l.timeSlot].push(l);});for(const ts of TIME_SLOTS){if(!g[ts])continue;html+=`<div class="ex-group-header">⏰ ${ts}</div>`;g[ts].forEach(l=>{html+=`<div class="ex-log-item stretch-item"><span class="el-name">${l._name||'?'}</span><span class="el-detail">${l._detail||''}</span><span class="el-sets">${l.sets}세트</span><span class="el-cal">${(l._cal||0)*l.sets}kcal</span></div>`;});}}
  html+=`<div style="text-align:right;margin-top:6px;font-size:12px;color:#e74c3c;font-weight:700">운동합계 ${calcExerciseCal(dl)+calcStretchCal(dl)}kcal</div>`;
  document.getElementById('exerciseCard').innerHTML=html;
}

// ── 식사 기록 카드 ──
function renderFoodCard(){
  const dk=dateKey();const logs=getWdLogs();const dl=logs[dk]||{};
  const food=Array.isArray(dl.food)?dl.food:[];
  let html=`<div class="card-title">🍽️ 식사 기록</div>`;
  if(!food.length){html+=`<div class="empty-msg">식사 기록 없음<br><span style="font-size:11px">운동기록8.html에서 입력하세요</span></div>`;document.getElementById('foodCard').innerHTML=html;return;}
  const g={};food.forEach(l=>{const k=l.mealTime||'snack';if(!g[k])g[k]=[];g[k].push(l);});
  for(const mt of MEAL_TIMES){if(!g[mt.id])continue;const items=g[mt.id];const gc=items.reduce((s,it)=>s+(it._calorie||0)*it.qty,0);const gp=items.reduce((s,it)=>s+(it._protein||0)*it.qty,0);html+=`<div class="meal-group-header"><span>${mt.icon} ${mt.name}</span><span>${Math.round(gc)}kcal · P${gp.toFixed(1)}g</span></div>`;items.forEach(l=>{html+=`<div class="food-log-item"><span class="fl-name">${l._name||'?'}${l.qty>1?` ×${l.qty}`:''}</span><span class="fl-macro">P${((l._protein||0)*l.qty).toFixed(1)} C${((l._carb||0)*l.qty).toFixed(1)} F${((l._fat||0)*l.qty).toFixed(1)}</span><span class="fl-cal">${Math.round((l._calorie||0)*l.qty)}kcal</span></div>`;});}
  const totalCal=Math.round(calcFoodCal(dl));const macro=calcFoodMacro(dl);
  html+=`<div style="margin-top:8px;padding:8px 12px;background:#f8f9fa;border-radius:10px;font-size:12px;display:flex;justify-content:space-between"><span>🥩${macro.p.toFixed(1)}g 🍚${macro.c.toFixed(1)}g 🧈${macro.f.toFixed(1)}g</span><span style="font-weight:700;color:#e74c3c">${totalCal}kcal</span></div>`;
  document.getElementById('foodCard').innerHTML=html;
}

// ── 주간 탭 ──
function renderWeekBpChart(){
  const today=new Date(currentDate);const MAX_SYS=180;
  let html=`<div class="card-title">📈 7일 혈압·맥박 추이</div>`;
  html+=`<div style="display:flex;gap:10px;font-size:10px;color:#888;margin-bottom:6px;flex-wrap:wrap"><span>🔴 수축기</span><span>🔵 이완기</span><span>─ 기준140</span><span>💗 맥박</span></div>`;
  let hasAny=false;
  for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);const dk=formatDate(d);const readings=getBpReadings(dk);const dayAvg=getDayBpAvg(readings);const isToday=dk===formatDate(new Date());const label=`${d.getMonth()+1}/${d.getDate()}`;if(dayAvg){hasAny=true;const sysW=Math.min(100,Math.round(dayAvg.sys/MAX_SYS*100));const diaW=Math.min(100,Math.round(dayAvg.dia/MAX_SYS*100));const st=getBpStatus(dayAvg.sys,dayAvg.dia);const refLine=Math.round(140/MAX_SYS*100);const hrSt=dayAvg.hr?getHrStatus(dayAvg.hr):null;const hrStr=dayAvg.hr&&hrSt?`<span style="color:${hrSt.color};font-size:10px"> 💗${dayAvg.hr}</span>`:'';html+=`<div class="chart-row"><div class="chart-date" style="${isToday?'color:#667eea;font-weight:700':''}">${label}<br><span style="font-size:9px">${getDayStr(d)}</span></div><div class="chart-bar-wrap"><div class="chart-bar-sys" style="width:${sysW}%;background:${st.color}"></div><div class="chart-bar-dia" style="width:${diaW}%;background:#2980b9"></div><div style="position:absolute;left:${refLine}%;top:0;width:2px;height:100%;background:#e74c3c;opacity:.4"></div></div><div class="chart-val" style="color:${st.color}">${dayAvg.sys}/${dayAvg.dia}${hrStr}</div></div>`;}else{html+=`<div class="chart-row"><div class="chart-date" style="${isToday?'color:#667eea;font-weight:700':''}">${label}<br><span style="font-size:9px">${getDayStr(d)}</span></div><div class="chart-bar-wrap" style="background:#f8f8f8"></div><div class="chart-val" style="color:#ccc">—</div></div>`;}}
  if(!hasAny)html+=`<div class="empty-msg">기록 없음</div>`;
  document.getElementById('weekBpChart').innerHTML=html;
}
function renderWeekScoreChart(){
  const today=new Date(currentDate);const fatLogs=getFatigueLogs();
  let html=`<div class="card-title">🔋 7일 피로도 점수 추이</div>`;
  let hasAny=false;
  for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);const dk=formatDate(d);const fs=fatLogs[dk];const isToday=dk===formatDate(new Date());const label=`${d.getMonth()+1}/${d.getDate()}`;if(fs&&fs.total!=null){hasAny=true;const v=fs.total;const gi=getFatigueGrade(v);html+=`<div class="chart-row"><div class="chart-date" style="${isToday?'color:#667eea;font-weight:700':''}">${label}<br><span style="font-size:9px">${getDayStr(d)}</span></div><div class="chart-bar-wrap"><div class="chart-bar-sys" style="width:${v}%;background:${gi.color}"></div></div><div class="chart-val" style="color:${gi.color}">${v}점 ${gi.grade.split(' ')[0]}</div></div>`;}else{html+=`<div class="chart-row"><div class="chart-date" style="${isToday?'color:#667eea;font-weight:700':''}">${label}<br><span style="font-size:9px">${getDayStr(d)}</span></div><div class="chart-bar-wrap" style="background:#f8f8f8"></div><div class="chart-val" style="color:#ccc">—</div></div>`;}}
  if(!hasAny)html+=`<div class="empty-msg">피로도 기록 없음</div>`;
  document.getElementById('weekScoreChart').innerHTML=html;
}
function renderWeekStats(){
  const today=new Date(currentDate);const wdLogs=getWdLogs();const fatLogs=getFatigueLogs();
  let html=`<div class="card-title">📊 7일 통계</div>`;
  const week=[];for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);week.push(formatDate(d));}
  const bpDays=week.filter(dk=>getBpReadings(dk).length>0);const bpAvgs=bpDays.map(dk=>getDayBpAvg(getBpReadings(dk))).filter(Boolean);
  if(bpAvgs.length){const avgSys=calcAvg(bpAvgs.map(a=>a.sys)),avgDia=calcAvg(bpAvgs.map(a=>a.dia));const maxSys=Math.max(...bpAvgs.map(a=>a.sys)),minSys=Math.min(...bpAvgs.map(a=>a.sys));const st=getBpStatus(avgSys,avgDia);const hrVals=bpAvgs.filter(a=>a.hr!=null).map(a=>a.hr);const avgHr=hrVals.length?calcAvg(hrVals):null;html+=`<div class="section-divider">💓 혈압·맥박 (${bpAvgs.length}일)</div>`;html+=`<div class="stat-row"><span class="stat-label">평균 혈압</span><span class="stat-val" style="color:${st.color}">${avgSys}/${avgDia} <span style="font-size:11px;color:#aaa">${st.label}</span></span></div>`;html+=`<div class="stat-row"><span class="stat-label">수축기 범위</span><span class="stat-val">${minSys} ~ ${maxSys}</span></div>`;if(avgHr){const hrSt=getHrStatus(avgHr);html+=`<div class="stat-row"><span class="stat-label">평균 맥박</span><span class="stat-val" style="color:${hrSt?hrSt.color:'#333'}">💗${avgHr}bpm ${hrSt?hrSt.label:''}</span></div>`;}}
  const fatDays=week.filter(dk=>fatLogs[dk]);if(fatDays.length){const scores=fatDays.map(dk=>fatLogs[dk].total||0);const avgScore=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);const gi=getFatigueGrade(avgScore);html+=`<div class="section-divider">🔋 피로도 (${fatDays.length}일)</div>`;html+=`<div class="stat-row"><span class="stat-label">평균 점수</span><span class="stat-val" style="color:${gi.color}">${avgScore}점 ${gi.grade}</span></div>`;html+=`<div class="stat-row"><span class="stat-label">최고/최저</span><span class="stat-val">${Math.max(...scores)} / ${Math.min(...scores)}</span></div>`;}
  const slDays=week.filter(dk=>wdLogs[dk]&&wdLogs[dk].sleep);if(slDays.length){const slMins=slDays.map(dk=>{const s=wdLogs[dk].sleep;return calcSleepMin(s.bedH,s.bedM,s.wakeH,s.wakeM);});const avgM=Math.round(slMins.reduce((a,b)=>a+b,0)/slMins.length);html+=`<div class="section-divider">😴 수면 (${slDays.length}일)</div>`;html+=`<div class="stat-row"><span class="stat-label">평균 수면</span><span class="stat-val">${formatSleepDuration(avgM)}</span></div>`;html+=`<div class="stat-row"><span class="stat-label">최장/최단</span><span class="stat-val">${formatSleepDuration(Math.max(...slMins))} / ${formatSleepDuration(Math.min(...slMins))}</span></div>`;}
  const exDays=week.filter(dk=>{const dl=wdLogs[dk];return dl&&((Array.isArray(dl.exercise)&&dl.exercise.length)||(Array.isArray(dl.stretch)&&dl.stretch.length));});
  html+=`<div class="section-divider">💪 운동</div>`;html+=`<div class="stat-row"><span class="stat-label">운동 일수</span><span class="stat-val">${exDays.length}일 / ${week.length}일</span></div>`;
  document.getElementById('weekStats').innerHTML=html;
}

// ── 전체 기록 히스토리 ──
function renderHistory(){
  const wdLogs=getWdLogs();const fatLogs=getFatigueLogs();
  const allKeys=new Set([...Object.keys(wdLogs).filter(k=>{const dl=wdLogs[k];return dl&&(dl.sleep||(dl.health&&(dl.health.weight||dl.health.bpReadings?.length))||(Array.isArray(dl.exercise)&&dl.exercise.length)||(Array.isArray(dl.food)&&dl.food.length)||dl.patient||dl.brain||dl.drink);}), ...Object.keys(fatLogs)]);
  const keys=[...allKeys].sort().reverse();
  if(!keys.length){document.getElementById('historyList').innerHTML=`<div class="empty-msg">기록이 없습니다</div>`;return;}
  let html=`<div style="font-size:12px;color:#888;margin-bottom:8px;text-align:center">총 ${keys.length}일</div>`;
  keys.forEach(dk=>{
    const dl=wdLogs[dk]||{};const fs=fatLogs[dk];
    const readings=getBpReadings(dk);const dayBpAvg=getDayBpAvg(readings);
    const d=new Date(dk.replace(/-/g,'/'));const dt=getDayTypeForLog(dl);
    const wkInfo=getWorkoutWeekInfo(d);
    const wkTag=wkInfo?`<span style="font-size:10px;background:#667eea20;color:#667eea;border:1px solid #667eea40;border-radius:8px;padding:1px 6px">${wkInfo.week}주차</span>`:'';
    let preview='';
    if(dt)preview+=`<span style="color:${dt.color}">${dt.icon}${dt.name} </span>`;
    if(fs){const gi=getFatigueGrade(fs.total||0);preview+=`<span style="color:${gi.color}">🔋${fs.total}점 </span>`;if(fs.pulse)preview+=`<span style="color:#667eea">💗${fs.pulse}bpm </span>`;}
    if(dayBpAvg){const st=getBpStatus(dayBpAvg.sys,dayBpAvg.dia);preview+=`<span style="color:${st.color}">💓${dayBpAvg.sys}/${dayBpAvg.dia} </span>`;if(dayBpAvg.hr)preview+=`<span>💗${dayBpAvg.hr}bpm </span>`;}
    if(dl.sleep){const m=calcSleepMin(dl.sleep.bedH,dl.sleep.bedM,dl.sleep.wakeH,dl.sleep.wakeM);const sc=m>=420?'#27ae60':m>=360?'#f39c12':'#e74c3c';preview+=`<span style="color:${sc}">😴${formatSleepDuration(m)} </span>`;}
    if(dl.health&&dl.health.weight!=null)preview+=`⚖️${dl.health.weight}kg `;
    const exLen=Array.isArray(dl.exercise)?dl.exercise.length:0;if(exLen)preview+=`💪${exLen}개 `;
    const fdLen=Array.isArray(dl.food)?dl.food.length:0;if(fdLen)preview+=`🍽️${fdLen}개 `;
    if(dl.patient)preview+=`🏥${dl.patient.actual}명 `;
    const bTopics=getBrainTopics(dl);if(bTopics.length)preview+=`🧠${bTopics.length}개 `;
    const dr=dl.drink||{};if(dr.soju>0||dr.beer>0)preview+=`🍺${(dr.soju||0)+(dr.beer||0)}병 `;
    const meds=getActiveMeds(dk);if(meds.length)preview+=`💊${meds.length}종 `;
    html+=`<div class="history-item" onclick="goToDate('${dk}')"><div class="hi-date">${dk} (${getDayStr(d)}) ${wkTag}</div><div class="hi-preview">${preview||'—'}</div></div>`;
  });
  document.getElementById('historyList').innerHTML=html;
}

// ── 전체 복사 ──
function copyAllRecords(){
  const wdLogs=getWdLogs();const fatLogs=getFatigueLogs();
  const allKeys=new Set([...Object.keys(wdLogs).filter(k=>{const dl=wdLogs[k];return dl&&(dl.sleep||dl.health||(Array.isArray(dl.exercise)&&dl.exercise.length)||dl.patient||dl.brain||dl.drink);}), ...Object.keys(fatLogs)]);
  const keys=[...allKeys].sort().reverse();
  const lines=['━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━','📊 건강 통합 기록',`📆 총 ${keys.length}일 | ${new Date().toLocaleString('ko-KR')}`,'━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━',''];
  keys.forEach(dk=>{lines.push(generateDayReport(dk));});
  lines.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  copyToClip(lines.join('\n'),'✅ 전체 기록 복사됨!');
}
function copyToClip(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast(msg)).catch(()=>fallbackCopy(text,msg));}else fallbackCopy(text,msg);}
function fallbackCopy(text,msg){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);try{document.execCommand('copy');showToast(msg||'✅ 복사됨');}catch(e){showToast('❌ 복사 실패');}document.body.removeChild(ta);}

// ── 탭·모달·날짜 이동 ──
function openModal(id){document.getElementById(id).classList.add('active');}
function closeModal(id){document.getElementById(id).classList.remove('active');}
function switchTab(tabId,btn){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('.bottom-nav .tab-btn').forEach(e=>e.classList.remove('active'));
  btn.classList.add('active');
  if(tabId==='tabWeek'){renderWeekBpChart();renderWeekScoreChart();renderWeekStats();}
  if(tabId==='tabHistory')renderHistory();
  if(tabId==='tabBackup'){cancelRestore();renderBackupPanel();}
}
function goToDate(dk){const p=dk.split('-');currentDate=new Date(+p[0],+p[1]-1,+p[2]);healthEditing=false;sleepEditing=false;patientEditing=false;medEditing=false;const btn=document.querySelector('.bottom-nav .tab-btn:first-child');switchTab('tabToday',btn);renderAll();}

// ── 전체 렌더 ──
function renderAll(){
  const dk=dateKey();const isToday=dk===formatDate(new Date());
  document.getElementById('dateDisplay').textContent=`${dk} (${getDayStr(currentDate)})${isToday?' 🔴':''}`;
  renderWeekBadge();renderLinkBanner();renderScoreBanner();renderSummaryCard();
  renderDayTypeCard();renderHealthCard();renderSleepCard();renderPatientCard();
  renderBrainCard();renderDrinkCard();renderBpCard();renderExerciseCard();renderFoodCard();
}
renderAll();
</script></body></html>
