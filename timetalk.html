<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>타임머신톡 - 15년 뒤의 나</title><style>  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }    body {    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;    background: #abc1d1;    height: 100vh;    overflow: hidden;    display: flex;    justify-content: center;  }  .phone {    width: 100%;    max-width: 480px;    height: 100vh;    background: #b2c7d9;    display: flex;    flex-direction: column;    position: relative;  }  /* 헤더 */  .header {    background: #b2c7d9;    padding: 14px 16px;    display: flex;    align-items: center;    border-bottom: 1px solid rgba(0,0,0,0.05);    flex-shrink: 0;  }  .back { font-size: 22px; color: #333; margin-right: 12px; }  .header-info { flex: 1; }  .header-name { font-size: 16px; font-weight: 600; color: #222; }  .header-sub { font-size: 11px; color: #666; margin-top: 2px; }  .header-icons { font-size: 18px; color: #555; letter-spacing: 8px; }  /* 채팅 영역 */  .chat {    flex: 1;    overflow-y: auto;    padding: 16px 12px 120px;    scroll-behavior: smooth;  }  .date-divider {    text-align: center;    margin: 12px 0 16px;  }  .date-divider span {    background: rgba(0,0,0,0.15);    color: #fff;    font-size: 11px;    padding: 4px 12px;    border-radius: 12px;  }  .section-divider {    text-align: center;    margin: 18px 0 10px;  }  .section-divider span {    background: rgba(255,255,255,0.6);    color: #444;    font-size: 12px;    font-weight: 600;    padding: 5px 14px;    border-radius: 14px;  }  /* 메시지 */  .msg-row {    display: flex;    margin-bottom: 4px;    align-items: flex-end;    animation: fadeIn 0.3s ease;  }  @keyframes fadeIn {    from { opacity: 0; transform: translateY(8px); }    to { opacity: 1; transform: translateY(0); }  }  .msg-row.left { justify-content: flex-start; }  .msg-row.right { justify-content: flex-end; }  .avatar {    width: 38px; height: 38px;    border-radius: 14px;    background: linear-gradient(135deg, #555, #222);    margin-right: 8px;    display: flex;    align-items: center;    justify-content: center;    font-size: 18px;    flex-shrink: 0;    align-self: flex-start;    margin-top: 4px;  }  .avatar.hidden { visibility: hidden; }  .msg-content { max-width: 75%; display: flex; flex-direction: column; }  .sender-name {    font-size: 12px;    color: #333;    margin-bottom: 4px;    margin-left: 2px;  }  .bubble-wrap { display: flex; align-items: flex-end; gap: 4px; }  .msg-row.right .bubble-wrap { flex-direction: row-reverse; }  .bubble {    padding: 8px 12px;    border-radius: 14px;    font-size: 14.5px;    line-height: 1.45;    word-break: break-word;    white-space: pre-wrap;  }  .bubble.left { background: #fff; color: #111; border-top-left-radius: 4px; }  .bubble.right { background: #fef01b; color: #111; border-top-right-radius: 4px; }  .time { font-size: 10px; color: #555; white-space: nowrap; }  /* 클릭 안내 */  .tap-hint {    position: absolute;    bottom: 80px;    left: 50%;    transform: translateX(-50%);    background: rgba(0,0,0,0.7);    color: white;    padding: 8px 18px;    border-radius: 20px;    font-size: 13px;    animation: pulse 1.5s infinite;    pointer-events: none;    z-index: 5;  }  @keyframes pulse {    0%, 100% { opacity: 0.7; }    50% { opacity: 1; }  }  /* 입력바 */  .input-bar {    position: absolute;    bottom: 0;    left: 0; right: 0;    background: #f7f7f7;    padding: 10px 12px;    display: flex;    align-items: center;    gap: 8px;    border-top: 1px solid #ddd;  }  .plus-btn {    width: 32px; height: 32px;    border-radius: 50%;    background: #e0e0e0;    display: flex; align-items: center; justify-content: center;    font-size: 20px; color: #666;  }  .input-area {    flex: 1;    background: white;    border-radius: 18px;    padding: 8px 14px;    font-size: 14px;    color: #999;    cursor: pointer;    user-select: none;    border: 1px solid #e0e0e0;  }  .input-area.active {    background: #fff8b3;    color: #333;    font-weight: 600;    animation: glow 1.5s infinite;  }  @keyframes glow {    0%, 100% { box-shadow: 0 0 0 0 rgba(254, 240, 27, 0.4); }    50% { box-shadow: 0 0 0 8px rgba(254, 240, 27, 0); }  }  .send-btn {    background: #ffd700;    color: #222;    padding: 7px 14px;    border-radius: 16px;    font-size: 13px;    font-weight: 600;    border: none;  }  /* 시작 오버레이 */  .start-overlay {    position: absolute;    inset: 0;    background: rgba(0,0,0,0.85);    color: white;    display: flex;    flex-direction: column;    justify-content: center;    align-items: center;    z-index: 100;    padding: 30px;    text-align: center;  }  .start-overlay h1 { font-size: 28px; margin-bottom: 10px; }  .start-overlay p { font-size: 14px; line-height: 1.7; opacity: 0.9; margin-bottom: 30px; }  .start-btn {    background: #fef01b;    color: #222;    padding: 14px 36px;    border-radius: 24px;    font-size: 16px;    font-weight: 700;    border: none;    cursor: pointer;  }  .start-overlay.hidden { display: none; }  /* 끝 메시지 */  .end-msg {    text-align: center;    color: #555;    font-size: 13px;    padding: 20px;    background: rgba(255,255,255,0.4);    border-radius: 12px;    margin: 20px 8px;    line-height: 1.7;  }  /* 스크롤바 */  .chat::-webkit-scrollbar { width: 0; }</style></head><body><div class="phone">  <!-- 시작 화면 -->  <div class="start-overlay" id="startOverlay">    <h1>⏰ 타임머신톡</h1>    <p>밤 11시 47분.<br>모르는 번호로 카톡이 왔다.<br><br>15년 뒤의 내가 보낸 메시지.<br>화면을 탭하며 대화를 이어가보세요.</p>    <button class="start-btn" onclick="startChat()">대화 시작하기</button>  </div>  <!-- 헤더 -->  <div class="header">    <div class="back">&lt;</div>    <div class="header-info">      <div class="header-name">15년 뒤의 나 🕰️</div>      <div class="header-sub">미래에서</div>    </div>    <div class="header-icons">⌕ ☰</div>  </div>  <!-- 채팅 영역 -->  <div class="chat" id="chat">    <div class="date-divider"><span>2026년 5월 16일 토요일</span></div>  </div>  <!-- 탭 힌트 -->  <div class="tap-hint" id="tapHint">👆 탭해서 답장하기</div>  <!-- 입력바 -->  <div class="input-bar">    <div class="plus-btn">+</div>    <div class="input-area" id="inputArea" onclick="nextMessage()">메시지를 보내려면 탭하세요</div>    <button class="send-btn" onclick="nextMessage()">전송</button>  </div></div><script>const messages = [  // 도입부  { side: 'left', name: '모르는 번호', text: '야 대화 좀 하자', time: '오후 11:47' },  { side: 'right', text: '누구세요? 번호 잘못 거셨어요', time: '오후 11:48' },  { side: 'left', name: '모르는 번호', text: '나야. 15년 뒤의 너.\n놀라지 말고 부탁 좀 들어줘', time: '오후 11:48' },  { side: 'right', text: 'ㅋㅋㅋ뭔데요 진짜', time: '오후 11:49' },  // 운동  { section: '💪 운동' },  { side: 'left', text: '너 근력운동 좀 해주라 제발', time: '오후 11:49' },  { side: 'right', text: '왜? 바빠 죽겠는데', time: '오후 11:50' },  { side: 'left', text: '나 지금 보행기 끌고 다녀\n손주가 안아달라는데 못 안아\n\n주 3회 30분만 해줘\n스쿼트 데드리프트 푸쉬업\n\n너 환자 부모한테 매일 운동시키라 그러잖아ㅋㅋ\n너부터 좀 해', time: '오후 11:50' },  { side: 'right', text: '...알았어 헬스장 끊을게', time: '오후 11:51' },  { side: 'left', text: '끊지만 말고 가라\n너 작년에도 끊고 두 번 갔잖아ㅋㅋ', time: '오후 11:51' },  // 재테크  { section: '💰 재테크' },  { side: 'left', text: '그리고 돈 얘기\n월 100만원만 나한테 보내줘', time: '오후 11:52' },  { side: 'right', text: '나 돈 없어\n병원 운영비에 애들 학비에...', time: '오후 11:53' },  { side: 'left', text: '야 너 그 돈 없어도 살잖아\n골프 한 번 덜 치면 되는 돈이야\n\n받아적어\nVOO 40 / QQQ 40 / SOXX 20\n매달 자동이체. 끝.\n\n그것만 15년 넣어주면\n내가 지금 한 달에 1000만원씩 써\n손주 용돈 주고 와이프랑 크루즈 다니고', time: '오후 11:53' },  { side: 'right', text: '진짜?', time: '오후 11:54' },  { side: 'left', text: '진짜\n\n그리고 명심해\n지인이 권하는 부동산, 비상장주, 친구 사업 — 다 망해\n너 주변에 그렇게 망한 선배 많지?\n\n복잡한 거 하지 말고 그냥 사\n보지도 마. 폭락해도 팔지 마', time: '오후 11:54' },  // 치아  { section: '🦷 치아' },  { side: 'left', text: '마지막으로 부탁\n6개월마다 스케일링 받아라', time: '오후 11:55' },  { side: 'right', text: '1년에 한 번이면 안 돼? 귀찮은데', time: '오후 11:56' },  { side: 'left', text: '야 나 지금 임플란트 다섯 개야\n천만원 넘게 썼어\n잇몸뼈 이식까지 했어 그거 얼마나 아픈지 알아?\n\n너 환자 엄마들한테 "아이 이 잘 닦이세요" 하루에 몇 번 말해?ㅋㅋ\n너부터 좀', time: '오후 11:56' },  { side: 'right', text: '...알았어 다음 주에 예약할게', time: '오후 11:57' },  { side: 'left', text: '그리고 자기 전 치실 써\n칫솔로는 안 닦여', time: '오후 11:57' },  // 마무리  { side: 'left', text: '나 이제 가야 돼\n차트 그만 보고 집에 가라\n와이프 기다린다', time: '오후 11:58' },  { end: true }];let currentIndex = 0;const chat = document.getElementById('chat');const inputArea = document.getElementById('inputArea');const tapHint = document.getElementById('tapHint');function startChat() {  document.getElementById('startOverlay').classList.add('hidden');  // 첫 메시지는 자동으로 표시  setTimeout(() => {    showMessage();  }, 500);}function showMessage() {  if (currentIndex >= messages.length) return;    const m = messages[currentIndex];  // 섹션 구분  if (m.section) {    const div = document.createElement('div');    div.className = 'section-divider';    div.innerHTML = `<span>${m.section}</span>`;    chat.appendChild(div);    currentIndex++;    scrollDown();    showMessage(); // 섹션은 자동으로 넘어가고 다음 메시지 표시    return;  }  // 끝  if (m.end) {    const div = document.createElement('div');    div.className = 'end-msg';    div.innerHTML = '✨ 모르는 번호의 카톡이<br>차단되었습니다<br><br>📝 내일 할 일이 메모장에 저장되었습니다';    chat.appendChild(div);    inputArea.textContent = '대화가 종료되었습니다';    inputArea.classList.remove('active');    inputArea.onclick = null;    tapHint.style.display = 'none';    scrollDown();    return;  }  // 메시지 렌더링  const row = document.createElement('div');  row.className = 'msg-row ' + m.side;  if (m.side === 'left') {    row.innerHTML = `      <div class="avatar">🕰️</div>      <div class="msg-content">        ${m.name ? `<div class="sender-name">${m.name}</div>` : ''}        <div class="bubble-wrap">          <div class="bubble left">${m.text}</div>          <div class="time">${m.time}</div>        </div>      </div>    `;  } else {    row.innerHTML = `      <div class="msg-content">        <div class="bubble-wrap">          <div class="time">${m.time}</div>          <div class="bubble right">${m.text}</div>        </div>      </div>    `;  }  chat.appendChild(row);  currentIndex++;  scrollDown();  updateHint();}function updateHint() {  if (currentIndex >= messages.length) {    tapHint.style.display = 'none';    inputArea.classList.remove('active');    return;  }    const next = messages[currentIndex];  // 다음 메시지가 섹션이면 그 다음 메시지 확인  let realNext = next;  let i = currentIndex;  while (realNext && realNext.section) {    i++;    realNext = messages[i];  }  if (realNext && realNext.side === 'right') {    inputArea.textContent = '👆 탭해서 답장하기';    inputArea.classList.add('active');    tapHint.style.display = 'block';    tapHint.textContent = '👆 탭해서 답장하기';  } else {    inputArea.textContent = '👆 탭해서 다음 메시지 보기';    inputArea.classList.add('active');    tapHint.style.display = 'block';    tapHint.textContent = '👆 탭해서 다음 메시지 보기';  }}function nextMessage() {  if (currentIndex >= messages.length) return;    // 다음 메시지가 왼쪽(상대방)이면 약간의 딜레이로 자연스럽게  const next = messages[currentIndex];  if (next.side === 'left') {    inputArea.textContent = '상대방이 입력 중...';    inputArea.classList.remove('active');    tapHint.style.display = 'none';    setTimeout(() => {      showMessage();      // 연속된 상대방 메시지가 있으면 자동으로 보여주지 않음 — 한 번에 하나씩    }, 600);  } else {    showMessage();  }}function scrollDown() {  setTimeout(() => {    chat.scrollTop = chat.scrollHeight;  }, 50);}</script></body></html>
