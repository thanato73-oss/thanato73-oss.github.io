<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소아성장 종합분석</title>
    <link rel="stylesheet" href="styles.css">
    <script src="headCircumferenceData.js"></script>
    <script src="heightData.js"></script>
    <script src="weightData.js"></script>
    <script src="bmiData.js"></script>
    <script src="weightDataUnder2.js"></script>
    <script src="weightData2To3.js"></script>
    <script src="weightDataAbove3.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>소아성장 종합분석 <span class="subtitle">(made by 나루토)</span></h1>
        </header>

        <div class="main-content">
            <div class="input-section">
                <h2>검사대상자 정보</h2>

                <div class="input-group">
                    <label for="nameInput">성명 (선택):</label>
                    <input type="text" id="nameInput" placeholder="이름 입력">
                </div>

                <div class="input-group">
                    <label for="rrnInput">주민등록번호:</label>
                    <input type="text" id="rrnInput" maxlength="14" placeholder="YYMMDD-GXXXXXX">
                </div>

                <div class="input-group">
                    <label for="dob">생년월일:</label>
                    <input type="date" id="dob">
                    <div class="button-group date-buttons">
                        <button data-unit="year" data-amount="-1">-1년</button>
                        <button data-unit="month" data-amount="-1">-1월</button>
                        <button data-unit="day" data-amount="-5">-5일</button>
                        <button data-unit="day" data-amount="-1">-1일</button>
                        <button data-unit="day" data-amount="1">+1일</button>
                        <button data-unit="day" data-amount="5">+5일</button>
                        <button data-unit="month" data-amount="1">+1월</button>
                        <button data-unit="year" data-amount="1">+1년</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="measurementDate">측정일:</label>
                    <input type="date" id="measurementDate">
                </div>

                <div class="input-group">
                    <label>성별:</label>
                    <div class="button-group gender-buttons">
                        <button type="button" data-gender="male">남아</button>
                        <button type="button" data-gender="female">여아</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="height">키 (cm):</label>
                    <input type="number" id="height" step="0.1" value="100">
                    <div class="button-group">
                        <button data-target="height" data-amount="-10">-10</button>
                        <button data-target="height" data-amount="-5">-5</button>
                        <button data-target="height" data-amount="-1">-1</button>
                        <button data-target="height" data-amount="1">+1</button>
                        <button data-target="height" data-amount="5">+5</button>
                        <button data-target="height" data-amount="10">+10</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="weight">몸무게 (kg):</label>
                    <input type="number" id="weight" step="0.1" value="10">
                    <div class="button-group">
                        <button data-target="weight" data-amount="-5">-5</button>
                        <button data-target="weight" data-amount="-1">-1</button>
                        <button data-target="weight" data-amount="-0.1">-0.1</button>
                        <button data-target="weight" data-amount="0.1">+0.1</button>
                        <button data-target="weight" data-amount="1">+1</button>
                        <button data-target="weight" data-amount="5">+5</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="headCircumference">머리둘레 (cm):</label>
                    <input type="number" id="headCircumference" step="0.1" value="0">
                    <div class="button-group">
                        <button data-target="headCircumference" data-amount="-5">-5</button>
                        <button data-target="headCircumference" data-amount="-1">-1</button>
                        <button data-target="headCircumference" data-amount="-0.1">-0.1</button>
                        <button data-target="headCircumference" data-amount="0.1">+0.1</button>
                        <button data-target="headCircumference" data-amount="1">+1</button>
                        <button data-target="headCircumference" data-amount="5">+5</button>
                        <button data-target="headCircumference" data-amount="45">+45</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="birthWeight">출생 체중 (kg):</label>
                    <input type="number" id="birthWeight" step="0.1" value="0">
                    <div class="button-group">
                        <button data-target="birthWeight" data-amount="-1">-1</button>
                        <button data-target="birthWeight" data-amount="-0.1">-0.1</button>
                        <button data-target="birthWeight" data-amount="0.1">+0.1</button>
                        <button data-target="birthWeight" data-amount="1">+1</button>
                        <button data-target="birthWeight" data-amount="3">+3</button>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="calculateBtn" class="primary">분석하기</button>
                    <button id="resetBtn">초기화</button>
                    <button id="printBtn">프린트</button>
                </div>
            </div>

            <div class="result-section" id="resultSection">
                <div id="resultContent">
                    <p>정보를 입력하고 '분석하기' 버튼을 누르세요.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
