<!DOCTYPE html><html lang="ko"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  <title>Todo App</title>  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>  <script src="https://cdn.tailwindcss.com"></script>  <style>    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }    .modal-bg { background: rgba(0,0,0,0.45); }    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }    .progress-bar { transition: width 0.4s ease; }    .fade-in { animation: fadeIn 0.2s ease; }    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }    .tag-urgent { background:#fee2e2; color:#dc2626; }    .tag-normal { background:#e0f2fe; color:#0284c7; }    .tag-cycle  { background:#f0fdf4; color:#16a34a; }    .tag-repeat { background:#fef9c3; color:#ca8a04; }    .tag-project{ background:#f5f3ff; color:#7c3aed; }  </style></head><body><div id="root"></div><script type="text/babel">const { useState, useEffect, useRef, useCallback } = React;/* ───────── 유틸 ───────── */const today = () => new Date().toISOString().slice(0,10);const diffDays = (a, b) => Math.floor((new Date(a)-new Date(b))/(1000*60*60*24));const diffWeeks = (a, b) => Math.floor(diffDays(a,b)/7);const uuid = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);function daysLeft(dateStr) {  if (!dateStr) return null;  return diffDays(dateStr, today());}function dueBadge(days) {  if (days === null) return null;  if (days < 0)  return { text: `${Math.abs(days)}일 초과`, cls: 'bg-red-200 text-red-700' };  if (days === 0) return { text: '오늘 마감', cls: 'bg-red-500 text-white' };  if (days <= 3)  return { text: `D-${days}`, cls: 'bg-orange-400 text-white' };  if (days <= 7)  return { text: `D-${days}`, cls: 'bg-yellow-400 text-gray-800' };  return { text: `D-${days}`, cls: 'bg-blue-100 text-blue-700' };}/* ───────── 로컬스토리지 ───────── */const STORAGE_KEY = 'todo_app_v1';function loadData() {  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }  catch { return []; }}function saveData(data) {  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));}/* ───────── 주기 할일 상태 계산 ───────── */function cycleStatus(task) {  if (!task.lastDone) return { text: '미완료 기록 없음', level: 'none' };  const elapsed = diffDays(today(), task.lastDone);  const elapsedW = task.cycleUnit === 'week' ? Math.floor(elapsed/7) : null;  const elapsedM = task.cycleUnit === 'month' ? Math.floor(elapsed/30) : null;  const elapsedY = task.cycleUnit === 'year'  ? Math.floor(elapsed/365) : null;  const elapsedDisp = elapsedW !== null ? `${elapsed}일(${elapsedW}주)` :                      elapsedM !== null ? `${elapsed}일(${elapsedM}개월)` :                      elapsedY !== null ? `${elapsed}일(${elapsedY}년)` : `${elapsed}일`;  const minDays = task.cycleUnit === 'week'  ? task.cycleMin * 7  :                  task.cycleUnit === 'month' ? task.cycleMin * 30 :                  task.cycleUnit === 'year'  ? task.cycleMin * 365 : task.cycleMin;  const maxDays = task.cycleUnit === 'week'  ? task.cycleMax * 7  :                  task.cycleUnit === 'month' ? task.cycleMax * 30 :                  task.cycleUnit === 'year'  ? task.cycleMax * 365 : task.cycleMax;  if (elapsed < minDays) return { text: `${elapsedDisp} 경과 (아직 ${minDays-elapsed}일 남음)`, level: 'ok' };  if (elapsed <= maxDays) return { text: `${elapsedDisp} 경과 ✔ 할 때가 됐어요`, level: 'warn' };  return { text: `${elapsedDisp} 경과 ⚠️ 주기 초과!`, level: 'over' };}/* ───────── 반복할일 다음 예정일 계산 ───────── */function nextRepeatDate(task) {  const base = task.repeatBase || today();  const now = new Date(today());  let d = new Date(base);  while (d <= now) {    if (task.repeatUnit === 'day')   d.setDate(d.getDate() + task.repeatInterval);    else if (task.repeatUnit === 'week')  d.setDate(d.getDate() + task.repeatInterval*7);    else if (task.repeatUnit === 'month') d.setMonth(d.getMonth() + task.repeatInterval);    else if (task.repeatUnit === 'year')  d.setFullYear(d.getFullYear() + task.repeatInterval);  }  return d.toISOString().slice(0,10);}function repeatWindowActive(task) {  if (!task.windowStart || !task.windowEnd) return true;  const next = nextRepeatDate(task);  const cycleStart = (() => {    let d = new Date(task.repeatBase || today());    const now = new Date(today());    let prev = new Date(d);    while (d <= now) {      prev = new Date(d);      if (task.repeatUnit === 'day')   d.setDate(d.getDate() + task.repeatInterval);      else if (task.repeatUnit === 'week')  d.setDate(d.getDate() + task.repeatInterval*7);      else if (task.repeatUnit === 'month') d.setMonth(d.getMonth() + task.repeatInterval);      else if (task.repeatUnit === 'year')  d.setFullYear(d.getFullYear() + task.repeatInterval);    }    return prev;  })();  // windowStart/End를 cycleStart 기준 상대 offset(일)으로 저장  const ws = new Date(cycleStart); ws.setDate(ws.getDate() + (task.windowStartOffset||0));  const we = new Date(cycleStart); we.setDate(we.getDate() + (task.windowEndOffset||0));  const t = new Date(today());  return t >= ws && t <= we;}/* ════════════════════════════════════   메인 앱════════════════════════════════════ */function App() {  const [tasks, setTasks] = useState(loadData);  const [modal, setModal] = useState(null); // null | 'add' | 'edit' | 'project-detail'  const [editTarget, setEditTarget] = useState(null);  const [filter, setFilter] = useState('all'); // all | simple | cycle | repeat | project  const [detailTask, setDetailTask] = useState(null);  const [search, setSearch] = useState('');  const fileRef = useRef();  useEffect(() => { saveData(tasks); }, [tasks]);  /* ── CRUD ── */  const addTask = t => setTasks(prev => [...prev, { ...t, id: uuid(), createdAt: today() }]);  const updateTask = t => setTasks(prev => prev.map(x => x.id === t.id ? t : x));  const deleteTask = id => setTasks(prev => prev.filter(x => x.id !== id));  const completeTask = (id) => setTasks(prev => prev.map(x => {    if (x.id !== id) return x;    if (x.type === 'cycle') return { ...x, lastDone: today() };    if (x.type === 'repeat') return { ...x, lastDone: today() };    return { ...x, done: true, doneAt: today() };  }));  const toggleSubTask = (taskId, subId) => setTasks(prev => prev.map(task => {    if (task.id !== taskId) return task;    const subs = task.subTasks.map(s => s.id === subId ? { ...s, done: !s.done } : s);    const allDone = subs.every(s => s.done);    return { ...task, subTasks: subs, done: allDone, doneAt: allDone ? today() : null };  }));  /* ── 백업 / 복원 ── */  const backup = () => {    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });    const a = document.createElement('a');    a.href = URL.createObjectURL(blob);    a.download = `todo_backup_${today()}.json`;    a.click();  };  const restore = (e) => {    const file = e.target.files[0];    if (!file) return;    const reader = new FileReader();    reader.onload = ev => {      try {        const data = JSON.parse(ev.target.result);        if (Array.isArray(data)) { setTasks(data); alert('복원 완료!'); }        else alert('올바른 백업 파일이 아닙니다.');      } catch { alert('파일 읽기 오류'); }    };    reader.readAsText(file);    e.target.value = '';  };  /* ── 정렬/필터 ── */  const sorted = [...tasks]    .filter(t => {      if (filter !== 'all' && t.type !== filter) return false;      if (search && !t.title.includes(search)) return false;      return true;    })    .sort((a, b) => {      const getDeadline = t => {        if (t.type === 'simple') return t.endDate || null;        if (t.type === 'repeat') return nextRepeatDate(t);        return null;      };      const da = getDeadline(a), db = getDeadline(b);      if (da && db) return da < db ? -1 : 1;      if (da) return -1;      if (db) return 1;      return 0;    });  const openEdit = (task) => { setEditTarget(task); setModal('edit'); };  const openDetail = (task) => { setDetailTask(task); setModal('project-detail'); };  return (    <div className="min-h-screen pb-20">      {/* 헤더 */}      <div className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-4 py-5 shadow-lg">        <div className="max-w-2xl mx-auto">          <div className="flex items-center justify-between mb-3">            <h1 className="text-2xl font-bold tracking-tight">📋 My Todo</h1>            <div className="flex gap-2">              <button onClick={backup}                className="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">                💾 백업              </button>              <button onClick={() => fileRef.current.click()}                className="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">                📂 복원              </button>              <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={restore}/>            </div>          </div>          <input value={search} onChange={e => setSearch(e.target.value)}            placeholder="🔍 검색..."            className="w-full rounded-xl px-4 py-2 text-gray-800 text-sm outline-none shadow"/>        </div>      </div>      {/* 필터 탭 */}      <div className="max-w-2xl mx-auto px-4 mt-4">        <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">          {[            ['all','전체'],['simple','일반'],['cycle','주기'],['repeat','반복'],['project','프로젝트']          ].map(([v,l]) => (            <button key={v} onClick={() => setFilter(v)}              className={`flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium transition                ${filter===v ? 'bg-indigo-600 text-white shadow' : 'bg-white text-gray-600 hover:bg-indigo-50'}`}>              {l}            </button>          ))}        </div>      </div>      {/* 할일 목록 */}      <div className="max-w-2xl mx-auto px-4 mt-4 space-y-3">        {sorted.length === 0 && (          <div className="text-center text-gray-400 py-16 text-sm">할일이 없어요 🎉</div>        )}        {sorted.map(task => (          <TaskCard key={task.id} task={task}            onComplete={() => completeTask(task.id)}            onEdit={() => openEdit(task)}            onDelete={() => deleteTask(task.id)}            onDetail={() => openDetail(task)}            onToggleSub={(sid) => toggleSubTask(task.id, sid)}          />        ))}      </div>      {/* FAB */}      <button onClick={() => { setEditTarget(null); setModal('add'); }}        className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-700          text-white text-3xl shadow-xl flex items-center justify-center transition z-50">        +      </button>      {/* 모달 */}      {(modal === 'add' || modal === 'edit') && (        <TaskModal          task={editTarget}          onSave={t => { editTarget ? updateTask(t) : addTask(t); setModal(null); }}          onClose={() => setModal(null)}        />      )}      {modal === 'project-detail' && detailTask && (        <ProjectDetailModal          task={detailTask}          onClose={() => setModal(null)}          onToggleSub={(sid) => toggleSubTask(detailTask.id, sid)}          onUpdate={t => { updateTask(t); setDetailTask(t); }}        />      )}    </div>  );}/* ════════════════════════════════════   TaskCard════════════════════════════════════ */function TaskCard({ task, onComplete, onEdit, onDelete, onDetail, onToggleSub }) {  const [expanded, setExpanded] = useState(false);  const typeLabel = { simple:'일반', cycle:'주기', repeat:'반복', project:'프로젝트' };  const typeClass = { simple:'tag-normal', cycle:'tag-cycle', repeat:'tag-repeat', project:'tag-project' };  const isDone = task.done;  /* 마감일 배지 */  let deadlineDays = null;  if (task.type === 'simple' && task.endDate) deadlineDays = daysLeft(task.endDate);  if (task.type === 'repeat') deadlineDays = daysLeft(nextRepeatDate(task));  const badge = dueBadge(deadlineDays);  /* 주기 상태 */  const cycle = task.type === 'cycle' ? cycleStatus(task) : null;  const cycleColor = { ok:'text-green-600', warn:'text-yellow-600', over:'text-red-600', none:'text-gray-400' };  /* 프로젝트 진행률 */  const subTotal = task.subTasks?.length || 0;  const subDone  = task.subTasks?.filter(s=>s.done).length || 0;  const pct = subTotal ? Math.round(subDone/subTotal*100) : 0;  return (    <div className={`bg-white rounded-2xl shadow-sm border fade-in      ${isDone ? 'opacity-50' : ''}      ${badge && deadlineDays !== null && deadlineDays <= 0 ? 'border-red-300' :        badge && deadlineDays !== null && deadlineDays <= 3 ? 'border-orange-200' : 'border-gray-100'}`}>      <div className="p-4">        <div className="flex items-start gap-3">          {/* 완료 버튼 */}          {task.type !== 'project' && (            <button onClick={onComplete}              className={`mt-0.5 w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition                ${isDone ? 'bg-indigo-500 border-indigo-500 text-white' : 'border-gray-300 hover:border-indigo-400'}`}>              {isDone && <span className="text-xs">✓</span>}            </button>          )}          {task.type === 'project' && (            <button onClick={() => setExpanded(e=>!e)}              className="mt-0.5 w-6 h-6 rounded-full border-2 border-purple-400 flex-shrink-0                flex items-center justify-center text-purple-500 text-xs hover:bg-purple-50 transition">              {expanded ? '▲' : '▼'}            </button>          )}          <div className="flex-1 min-w-0">            <div className="flex items-center gap-2 flex-wrap">              <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${typeClass[task.type]}`}>                {typeLabel[task.type]}              </span>              <span className={`font-semibold text-gray-800 ${isDone ? 'line-through text-gray-400' : ''}`}>                {task.title}              </span>              {badge && (                <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${badge.cls}`}>                  {badge.text}                </span>              )}            </div>            {/* 부가 정보 */}            <div className="mt-1 text-xs text-gray-500 space-y-0.5">              {task.type === 'simple' && task.startDate && (                <div>📅 {task.startDate} ~ {task.endDate || '?'}</div>              )}              {task.type === 'cycle' && cycle && (                <div className={cycleColor[cycle.level]}>                  🔄 주기 {task.cycleMin}{task.cycleUnit==='week'?'주':task.cycleUnit==='month'?'개월':'년'}                  {task.cycleMin !== task.cycleMax ? `~${task.cycleMax}${task.cycleUnit==='week'?'주':task.cycleUnit==='month'?'개월':'년'}` : ''} | {cycle.text}                </div>              )}              {task.type === 'repeat' && (                <div>🔁 {task.repeatInterval}{task.repeatUnit==='day'?'일':task.repeatUnit==='week'?'주':task.repeatUnit==='month'?'개월':'년'}마다 | 다음 {nextRepeatDate(task)}</div>              )}              {task.type === 'project' && (                <div className="mt-2">                  <div className="flex items-center justify-between mb-1">                    <span className="text-purple-600 font-medium">진행률 {subDone}/{subTotal}</span>                    <span className="text-purple-600 font-bold">{pct}%</span>                  </div>                  <div className="w-full bg-gray-100 rounded-full h-2">                    <div className="progress-bar bg-purple-500 h-2 rounded-full" style={{width:`${pct}%`}}/>                  </div>                  {task.endDate && (                    <div className="mt-1">📅 마감 {task.endDate}</div>                  )}                </div>              )}              {task.note && <div className="text-gray-400">📝 {task.note}</div>}            </div>            {/* 프로젝트 하위 할일 */}            {task.type === 'project' && expanded && (              <div className="mt-3 space-y-2 pl-1">                {(task.subTasks||[]).map(s => (                  <div key={s.id} className="flex items-center gap-2 text-sm">                    <button onClick={() => onToggleSub(s.id)}                      className={`w-5 h-5 rounded border-2 flex-shrink-0 flex items-center justify-center transition                        ${s.done ? 'bg-purple-500 border-purple-500 text-white' : 'border-gray-300 hover:border-purple-400'}`}>                      {s.done && <span className="text-xs">✓</span>}                    </button>                    <span className={s.done ? 'line-through text-gray-400' : 'text-gray-700'}>{s.title}</span>                    {s.endDate && (() => {                      const b = dueBadge(daysLeft(s.endDate));                      return b ? <span className={`text-xs px-1.5 py-0.5 rounded-full ${b.cls}`}>{b.text}</span> : null;                    })()}                  </div>                ))}                <button onClick={onDetail}                  className="text-xs text-purple-500 hover:underline mt-1">                  + 하위할일 편집                </button>              </div>            )}          </div>          {/* 액션 버튼 */}          <div className="flex gap-1 flex-shrink-0">            <button onClick={onEdit}              className="text-gray-400 hover:text-indigo-500 text-sm p-1 rounded transition">✏️</button>            <button onClick={onDelete}              className="text-gray-400 hover:text-red-500 text-sm p-1 rounded transition">🗑️</button>          </div>        </div>      </div>    </div>  );}/* ════════════════════════════════════   TaskModal (추가/편집)════════════════════════════════════ */function TaskModal({ task, onSave, onClose }) {  const isEdit = !!task;  const [type, setType] = useState(task?.type || 'simple');  const [title, setTitle] = useState(task?.title || '');  const [startDate, setStartDate] = useState(task?.startDate || '');  const [endDate, setEndDate] = useState(task?.endDate || '');  const [note, setNote] = useState(task?.note || '');  // 주기 할일  const [cycleMin, setCycleMin] = useState(task?.cycleMin || 2);  const [cycleMax, setCycleMax] = useState(task?.cycleMax || 4);  const [cycleUnit, setCycleUnit] = useState(task?.cycleUnit || 'week');  const [lastDone, setLastDone] = useState(task?.lastDone || '');  // 반복 할일  const [repeatInterval, setRepeatInterval] = useState(task?.repeatInterval || 1);  const [repeatUnit, setRepeatUnit] = useState(task?.repeatUnit || 'month');  const [repeatBase, setRepeatBase] = useState(task?.repeatBase || today());  const [hasWindow, setHasWindow] = useState(!!(task?.windowStartOffset !== undefined && task?.windowEndOffset !== undefined));  const [windowStartOffset, setWindowStartOffset] = useState(task?.windowStartOffset ?? 0);  const [windowEndOffset, setWindowEndOffset] = useState(task?.windowEndOffset ?? 30);  // 프로젝트  const [subTasks, setSubTasks] = useState(task?.subTasks || []);  const [newSub, setNewSub] = useState('');  const [newSubEnd, setNewSubEnd] = useState('');  const handleSave = () => {    if (!title.trim()) { alert('제목을 입력하세요'); return; }    const base = { id: task?.id, title: title.trim(), type, note, done: task?.done||false, doneAt: task?.doneAt||null, createdAt: task?.createdAt };    let extra = {};    if (type === 'simple') extra = { startDate, endDate };    if (type === 'cycle')  extra = { cycleMin: +cycleMin, cycleMax: +cycleMax, cycleUnit, lastDone };    if (type === 'repeat') extra = { repeatInterval: +repeatInterval, repeatUnit, repeatBase,      ...(hasWindow ? { windowStartOffset: +windowStartOffset, windowEndOffset: +windowEndOffset } : {}) };    if (type === 'project') extra = { startDate, endDate, subTasks };    onSave({ ...base, ...extra });  };  const addSub = () => {    if (!newSub.trim()) return;    setSubTasks(s => [...s, { id: uuid(), title: newSub.trim(), done: false, endDate: newSubEnd }]);    setNewSub(''); setNewSubEnd('');  };  const removeSub = id => setSubTasks(s => s.filter(x => x.id !== id));  const unitLabel = u => u==='day'?'일':u==='week'?'주':u==='month'?'개월':'년';  return (    <div className="fixed inset-0 modal-bg flex items-end sm:items-center justify-center z-50 p-4">      <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto fade-in">        <div className="sticky top-0 bg-white px-5 py-4 border-b flex items-center justify-between rounded-t-2xl">          <h2 className="text-lg font-bold text-gray-800">{isEdit ? '할일 편집' : '할일 추가'}</h2>          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>        </div>        <div className="px-5 py-4 space-y-4">          {/* 유형 선택 */}          <div>            <label className="text-xs font-semibold text-gray-500 mb-2 block">유형</label>            <div className="grid grid-cols-4 gap-2">              {[['simple','일반 📝'],['cycle','주기 🔄'],['repeat','반복 🔁'],['project','프로젝트 📁']].map(([v,l]) => (                <button key={v} onClick={() => setType(v)}                  className={`py-2 rounded-xl text-sm font-medium transition                    ${type===v ? 'bg-indigo-600 text-white shadow' : 'bg-gray-100 text-gray-600 hover:bg-indigo-50'}`}>                  {l}                </button>              ))}            </div>          </div>          {/* 제목 */}          <div>            <label className="text-xs font-semibold text-gray-500 mb-1 block">제목 *</label>            <input value={title} onChange={e => setTitle(e.target.value)}              placeholder="할일을 입력하세요"              className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"/>          </div>          {/* 일반 할일 */}          {type === 'simple' && (            <div className="grid grid-cols-2 gap-3">              <div>                <label className="text-xs font-semibold text-gray-500 mb-1 block">시작일</label>                <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}                  className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>              </div>              <div>                <label className="text-xs font-semibold text-gray-500 mb-1 block">종료일</label>                <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)}                  className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>              </div>            </div>          )}          {/* 주기 할일 */}          {type === 'cycle' && (            <div className="space-y-3">              <div>                <label className="text-xs font-semibold text-gray-500 mb-1 block">주기 단위</label>                <select value={cycleUnit} onChange={e=>setCycleUnit(e.target.value)}                  className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400">                  <option value="week">주</option>                  <option value="month">개월</option>                  <option value="year">년</option>                </select>              </div>              <div className="grid grid-cols-2 gap-3">                <div>                  <label className="text-xs font-semibold text-gray-500 mb-1 block">최소 주기</label>                  <div className="flex items-center gap-2">                    <input type="number" min="1" value={cycleMin} onChange={e=>setCycleMin(e.target.value)}                      className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>                    <span className="text-sm text-gray-500 flex-shrink-0">{unitLabel(cycleUnit)}</span>                  </div>                </div>                <div>                  <label className="text-xs font-semibold text-gray-500 mb-1 block">최대 주기</label>                  <div className="flex items-center gap-2">                    <input type="number" min="1" value={cycleMax} onChange={e=>setCycleMax(e.target.value)}                      className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>                    <span className="text-sm text-gray-500 flex-shrink-0">{unitLabel(cycleUnit)}</span>                  </div>                </div>              </div>              <div>                <label className="text-xs font-semibold text-gray-500 mb-1 block">마지막 완료일</label>                <input type="date" value={lastDone} onChange={e=>setLastDone(e.target.value)}                  className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>              </div>            </div>          )}          {/* 반복 할일 */}          {type === 'repeat' && (            <div className="space-y-3">              <div className="grid grid-cols-2 gap-3">                <div>                  <label className="text-xs font-semibold text-gray-500 mb-1 block">반복 간격</label>                  <input type="number" min="1" value={repeatInterval} onChange={e=>setRepeatInterval(e.target.value)}                    className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>                </div>                <div>                  <label className="text-xs font-semibold text-gray-500 mb-1 block">단위</label>                  <select value={repeatUnit} onChange={e=>setRepeatUnit(e.target.value)}                    className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400">                    <option value="day">일</option>                    <option value="week">주</option>                    <option value="month">개월</option>                    <option value="year">년</option>                  </select>                </div>              </div>              <div>                <label className="text-xs font-semibold text-gray-500 mb-1 block">기준 시작일</label>                <input type="date" value={repeatBase} onChange={e=>setRepeatBase(e.target.value)}                  className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>              </div>              <div>                <label className="flex items-center gap-2 cursor-pointer">                  <input type="checkbox" checked={hasWindow} onChange={e=>setHasWindow(e.target.checked)}                    className="rounded"/>                  <span className="text-sm font-semibold text-gray-600">수행 기간(윈도우) 설정</span>                </label>                {hasWindow && (                  <div className="grid grid-cols-2 gap-3 mt-2">                    <div>                      <label className="text-xs text-gray-500 mb-1 block">시작 (주기 시작 후 +일)</label>                      <input type="number" min="0" value={windowStartOffset} onChange={e=>setWindowStartOffset(e.target.value)}                        className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>                    </div>                    <div>                      <label className="text-xs text-gray-500 mb-1 block">종료 (주기 시작 후 +일)</label>                      <input type="number" min="0" value={windowEndOffset} onChange={e=>setWindowEndOffset(e.target.value)}                        className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>                    </div>                  </div>                )}              </div>            </div>          )}          {/* 프로젝트 */}          {type === 'project' && (            <div className="space-y-3">              <div className="grid grid-cols-2 gap-3">                <div>                  <label className="text-xs font-semibold text-gray-500 mb-1 block">시작일</label>                  <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}                    className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>                </div>                <div>                  <label className="text-xs font-semibold text-gray-500 mb-1 block">마감일</label>                  <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)}                    className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>                </div>              </div>              <div>                <label className="text-xs font-semibold text-gray-500 mb-2 block">하위 할일</label>                <div className="space-y-2 mb-2">                  {subTasks.map(s => (                    <div key={s.id} className="flex items-center gap-2 bg-gray-50 rounded-xl px-3 py-2">                      <span className="flex-1 text-sm text-gray-700">{s.title}</span>                      {s.endDate && <span className="text-xs text-gray-400">{s.endDate}</span>}                      <button onClick={() => removeSub(s.id)} className="text-red-400 hover:text-red-600 text-xs">✕</button>                    </div>                  ))}                </div>                <div className="flex gap-2">                  <input value={newSub} onChange={e=>setNewSub(e.target.value)}                    onKeyDown={e => e.key==='Enter' && addSub()}                    placeholder="하위 할일 입력"                    className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-400"/>                  <input type="date" value={newSubEnd} onChange={e=>setNewSubEnd(e.target.value)}                    className="border border-gray-200 rounded-xl px-2 py-2 text-sm outline-none focus:border-indigo-400 w-36"/>                  <button onClick={addSub}                    className="bg-indigo-600 text-white px-3 py-2 rounded-xl text-sm hover:bg-indigo-700 transition">                    +                  </button>                </div>              </div>            </div>          )}          {/* 메모 */}          <div>            <label className="text-xs font-semibold text-gray-500 mb-1 block">메모</label>            <input value={note} onChange={e=>setNote(e.target.value)}              placeholder="메모 (선택)"              className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-400"/>          </div>        </div>        <div className="px-5 pb-5 flex gap-3">          <button onClick={onClose}            className="flex-1 py-3 rounded-xl border border-gray-200 text-gray-600 font-semibold hover:bg-gray-50 transition">            취소          </button>          <button onClick={handleSave}            className="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition shadow">            {isEdit ? '저장' : '추가'}          </button>        </div>      </div>    </div>  );}/* ════════════════════════════════════   ProjectDetailModal════════════════════════════════════ */function ProjectDetailModal({ task, onClose, onToggleSub, onUpdate }) {  const [newSub, setNewSub] = useState('');  const [newSubEnd, setNewSubEnd] = useState('');  const addSub = () => {    if (!newSub.trim()) return;    const updated = { ...task, subTasks: [...(task.subTasks||[]), { id: uuid(), title: newSub.trim(), done: false, endDate: newSubEnd }] };    onUpdate(updated);    setNewSub(''); setNewSubEnd('');  };  const removeSub = (id) => {    const updated = { ...task, subTasks: task.subTasks.filter(s => s.id !== id) };    onUpdate(updated);  };  const subTotal = task.subTasks?.length || 0;  const subDone  = task.subTasks?.filter(s=>s.done).length || 0;  const pct = subTotal ? Math.round(subDone/subTotal*100) : 0;  return (    <div className="fixed inset-0 modal-bg flex items-end sm:items-center justify-center z-50 p-4">      <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto fade-in">        <div className="sticky top-0 bg-white px-5 py-4 border-b flex items-center justify-between rounded-t-2xl">          <div>            <h2 className="text-lg font-bold text-gray-800">📁 {task.title}</h2>            <p className="text-xs text-gray-400">{task.startDate||''} {task.endDate ? `~ ${task.endDate}` : ''}</p>          </div>          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>        </div>        <div className="px-5 py-4">          {/* 진행률 */}          <div className="mb-4">            <div className="flex justify-between text-sm mb-1">              <span className="text-purple-600 font-semibold">진행률</span>              <span className="text-purple-600 font-bold">{subDone}/{subTotal} ({pct}%)</span>            </div>            <div className="w-full bg-gray-100 rounded-full h-3">              <div className="progress-bar bg-purple-500 h-3 rounded-full" style={{width:`${pct}%`}}/>            </div>          </div>          {/* 하위 할일 목록 */}          <div className="space-y-2 mb-4">            {(task.subTasks||[]).map(s => {              const b = s.endDate ? dueBadge(daysLeft(s.endDate)) : null;              return (                <div key={s.id} className={`flex items-center gap-3 p-3 rounded-xl border transition                  ${s.done ? 'bg-gray-50 border-gray-100' : 'bg-white border-gray-200'}`}>                  <button onClick={() => onToggleSub(s.id)}                    className={`w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition                      ${s.done ? 'bg-purple-500 border-purple-500 text-white' : 'border-gray-300 hover:border-purple-400'}`}>                    {s.done && <span className="text-xs">✓</span>}                  </button>                  <span className={`flex-1 text-sm ${s.done ? 'line-through text-gray-400' : 'text-gray-700'}`}>{s.title}</span>                  {b && <span className={`text-xs px-2 py-0.5 rounded-full ${b.cls}`}>{b.text}</span>}                  <button onClick={() => removeSub(s.id)} className="text-red-300 hover:text-red-500 text-xs">✕</button>                </div>              );            })}          </div>          {/* 하위 할일 추가 */}          <div className="flex gap-2">            <input value={newSub} onChange={e=>setNewSub(e.target.value)}              onKeyDown={e => e.key==='Enter' && addSub()}              placeholder="하위 할일 추가"              className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-400"/>            <input type="date" value={newSubEnd} onChange={e=>setNewSubEnd(e.target.value)}              className="border border-gray-200 rounded-xl px-2 py-2 text-sm outline-none focus:border-purple-400 w-36"/>            <button onClick={addSub}              className="bg-purple-600 text-white px-3 py-2 rounded-xl text-sm hover:bg-purple-700 transition">+</button>          </div>        </div>        <div className="px-5 pb-5">          <button onClick={onClose}            className="w-full py-3 rounded-xl bg-purple-600 text-white font-semibold hover:bg-purple-700 transition shadow">            닫기          </button>        </div>      </div>    </div>  );}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
