<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>MY 자산 Beta</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="ms.png"><link rel="apple-touch-icon" href="ms.png"><meta name="theme-color" content="#0a0a0a"><style>  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }  html, body {    background: #0a0a0a;    color: #fff;    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;    min-height: 100vh;    overflow-x: hidden;    overscroll-behavior-y: contain;  }  body { position: relative; }  /* Pull to refresh indicator */  .pull-indicator {    position: fixed;    top: 0;    left: 50%;    transform: translateX(-50%) translateY(-60px);    width: 50px;    height: 50px;    background: rgba(255,255,255,0.08);    border-radius: 50%;    display: flex;    align-items: center;    justify-content: center;    z-index: 100;    transition: transform 0.2s ease, opacity 0.2s ease;    opacity: 0;    backdrop-filter: blur(10px);  }  .pull-indicator svg {    width: 24px;    height: 24px;    transition: transform 0.2s ease;  }  .pull-indicator.spinning svg {    animation: spin 0.8s linear infinite;  }  @keyframes spin {    from { transform: rotate(0deg); }    to { transform: rotate(360deg); }  }  /* Status bar */  .status-bar {    display: flex;    justify-content: space-between;    align-items: center;    padding: 12px 20px 8px;    font-size: 14px;    font-weight: 600;  }  .status-bar .right {    display: flex;    align-items: center;    gap: 6px;    font-size: 12px;    color: #ccc;  }  .battery {    background: #fff;    color: #000;    padding: 2px 6px;    border-radius: 4px;    font-size: 11px;    font-weight: 700;  }  /* Header */  .header {    display: flex;    align-items: center;    justify-content: space-between;    padding: 12px 20px;  }  .header-title {    display: flex;    align-items: center;    gap: 8px;    font-size: 20px;    font-weight: 700;  }  .header-title .beta {    color: #ff6b35;    font-style: italic;    font-size: 16px;    font-weight: 600;  }  .back-arrow {    font-size: 22px;    color: #fff;    cursor: pointer;  }  .gear {    font-size: 20px;    color: #aaa;    cursor: pointer;  }  /* Tabs */  .tabs {    display: flex;    padding: 0 20px;    border-bottom: 1px solid #1a1a1a;  }  .tab {    flex: 1;    text-align: center;    padding: 14px 0;    font-size: 15px;    color: #666;    position: relative;    cursor: pointer;    display: flex;    align-items: center;    justify-content: center;    gap: 6px;  }  .tab.active {    color: #fff;    font-weight: 700;  }  .tab.active::after {    content: '';    position: absolute;    bottom: -1px;    left: 20%;    right: 20%;    height: 2px;    background: #fff;  }  .tab-dot {    width: 8px;    height: 8px;    border-radius: 50%;    background: #333;  }  /* Summary bar */  .summary-bar {    margin: 16px 20px;    background: #1a1a1a;    border-radius: 12px;    padding: 14px 16px;    display: flex;    align-items: center;    justify-content: space-between;    font-size: 14px;  }  .summary-bar .icon {    display: inline-block;    width: 16px;    height: 16px;    background: linear-gradient(180deg, #ff6b35 50%, #fff 50%);    margin-right: 8px;    vertical-align: middle;  }  /* Action buttons */  .action-row {    display: flex;    gap: 10px;    padding: 0 20px;    justify-content: center;    margin-bottom: 20px;  }  .action-btn {    background: #1a1a1a;    border: none;    color: #fff;    padding: 10px 16px;    border-radius: 20px;    font-size: 13px;    cursor: pointer;    display: flex;    align-items: center;    gap: 6px;  }  /* Main amount */  .main-amount {    text-align: center;    padding: 20px 20px 8px;  }  .amount {    font-size: clamp(32px, 8vw, 44px);    font-weight: 800;    letter-spacing: -1.5px;    color: #fff;    transition: color 0.3s ease;  }  .amount.up { color: #ff6b35; }  .amount.down { color: #4a9eff; }  .institutions {    text-align: center;    color: #888;    font-size: 13px;    margin-top: 8px;  }  .chevron-down {    display: block;    text-align: center;    color: #666;    margin-top: 4px;    font-size: 14px;  }  /* Quick menu */  .quick-menu {    display: grid;    grid-template-columns: repeat(4, 1fr);    padding: 24px 20px;    gap: 8px;  }  .quick-item {    display: flex;    flex-direction: column;    align-items: center;    gap: 8px;    cursor: pointer;  }  .quick-icon {    width: 48px;    height: 48px;    background: #1a1a1a;    border-radius: 14px;    display: flex;    align-items: center;    justify-content: center;    font-size: 20px;  }  .quick-label {    font-size: 12px;    color: #ccc;  }  /* Portfolio link */  .portfolio-link {    display: flex;    align-items: center;    justify-content: space-between;    margin: 0 20px;    padding: 16px 0;    border-top: 1px solid #1a1a1a;    cursor: pointer;  }  .portfolio-link-left {    display: flex;    align-items: center;    gap: 8px;    font-size: 15px;    font-weight: 600;  }  .portfolio-link .bar-icon {    width: 16px;    height: 16px;    background: linear-gradient(180deg, #ff6b35 50%, #fff 50%);  }  /* Sub tabs */  .sub-tabs {    display: flex;    margin: 8px 20px 16px;    background: #1a1a1a;    border-radius: 12px;    padding: 4px;  }  .sub-tab {    flex: 1;    text-align: center;    padding: 10px;    font-size: 14px;    color: #888;    border-radius: 10px;    cursor: pointer;  }  .sub-tab.active {    background: #2a2a2a;    color: #fff;    font-weight: 600;  }  /* Stock filter */  .stock-filter {    display: flex;    justify-content: flex-end;    padding: 0 20px;    margin-bottom: 12px;    font-size: 13px;    color: #ccc;  }  .check {    color: #ff6b35;    margin-right: 4px;  }  /* Stock item */  .stock-item {    display: flex;    align-items: center;    padding: 14px 20px;    gap: 12px;  }  .stock-logo {    width: 44px;    height: 44px;    border-radius: 50%;    background: #2a4a8a;    display: flex;    align-items: center;    justify-content: center;    font-size: 18px;    flex-shrink: 0;    position: relative;  }  .flag {    position: absolute;    bottom: -2px;    right: -2px;    font-size: 14px;  }  .stock-info {    flex: 1;    min-width: 0;  }  .stock-name {    font-size: 15px;    font-weight: 600;    white-space: nowrap;    overflow: hidden;    text-overflow: ellipsis;  }  .stock-broker {    font-size: 12px;    color: #888;    margin-top: 2px;  }  .stock-value {    text-align: right;  }  .stock-amount {    font-size: 15px;    font-weight: 700;  }  .stock-profit {    font-size: 12px;    color: #ff6b35;    margin-top: 2px;  }  /* Date picker */  .date-picker-wrap {    margin: 0 20px 12px;    background: #1a1a1a;    border-radius: 12px;    padding: 12px 16px;    display: flex;    align-items: center;    justify-content: space-between;  }  .date-picker-wrap label {    font-size: 13px;    color: #aaa;  }  .date-picker-wrap input {    background: #2a2a2a;    border: 1px solid #333;    color: #fff;    padding: 6px 10px;    border-radius: 8px;    font-size: 13px;    font-family: inherit;  }  .date-picker-wrap input::-webkit-calendar-picker-indicator {    filter: invert(1);  }  .future-badge {    display: inline-block;    background: rgba(255, 107, 53, 0.15);    color: #ff6b35;    font-size: 11px;    padding: 2px 8px;    border-radius: 10px;    margin-left: 8px;    font-weight: 600;  }  /* Bottom nav */  .bottom-nav {    display: flex;    justify-content: space-around;    padding: 12px 0 20px;    border-top: 1px solid #1a1a1a;    margin-top: 20px;  }  .nav-item {    display: flex;    flex-direction: column;    align-items: center;    gap: 4px;    font-size: 11px;    color: #666;    cursor: pointer;  }  .nav-item.active { color: #fff; font-weight: 600; }  .nav-icon { font-size: 20px; }  /* Pull state */  body.pulling { transition: transform 0.2s ease; }</style></head><body><div class="pull-indicator" id="pullIndicator">  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">    <path d="M21 12a9 9 0 11-6.219-8.56"/>    <polyline points="21 3 21 9 15 9"/>  </svg></div><!-- Status bar --><div class="status-bar">  <span id="clock">7:30</span>  <div class="right">    <span>📶</span>    <span class="battery">49</span>  </div></div><!-- Header --><div class="header">  <div class="header-title">    <span class="back-arrow">‹</span>    MY자산 <span class="beta">Beta</span>  </div>  <span class="gear">⚙</span></div><!-- Tabs --><div class="tabs">  <div class="tab active">자산</div>  <div class="tab"><span class="tab-dot"></span>국내주식</div>  <div class="tab"><span class="tab-dot"></span>해외주식</div></div><!-- Summary --><div class="summary-bar">  <span><span class="icon"></span>진용만님의 투자 활동을 요약해 봤어요</span>  <span style="color:#888">⌄</span></div><!-- Date picker --><div class="date-picker-wrap">  <label for="dateInput">📅 기준일</label>  <div>    <input type="date" id="dateInput">    <span class="future-badge" id="futureBadge" style="display:none;">미래</span>  </div></div><!-- Action buttons --><div class="action-row">  <button class="action-btn">⇄ 미래에셋증권 순자산 보기</button>  <button class="action-btn">👁 숨김 ⓘ</button></div><!-- Main amount --><div class="main-amount">  <div class="amount" id="amount">9,046,319,222원</div></div><div class="institutions">총 <span id="instCount">13</span>개 기관 연결중</div><div class="chevron-down">⌄</div><!-- Quick menu --><div class="quick-menu">  <div class="quick-item"><div class="quick-icon">📊</div><div class="quick-label">투자수익</div></div>  <div class="quick-item"><div class="quick-icon">💼</div><div class="quick-label">종합잔고</div></div>  <div class="quick-item"><div class="quick-icon">☂️</div><div class="quick-label">MY 연금</div></div>  <div class="quick-item"><div class="quick-icon">↪️</div><div class="quick-label">이체</div></div></div><!-- Portfolio link --><div class="portfolio-link">  <div class="portfolio-link-left"><span class="bar-icon"></span>MY 포트폴리오 보기</div>  <span style="color:#666">›</span></div><!-- Sub tabs --><div class="sub-tabs">  <div class="sub-tab active">투자상품</div>  <div class="sub-tab">계좌</div></div><!-- Stock filter --><div class="stock-filter">  <span><span class="check">☑</span>주식만 보기</span></div><!-- Stock item --><div class="stock-item">  <div class="stock-logo">ETF<span class="flag">🇺🇸</span></div>  <div class="stock-info">    <div class="stock-name">QQQ 레버리지 3배···</div>    <div class="stock-broker">키움증권</div>  </div>  <div class="stock-value">    <div class="stock-amount" id="stockAmount">1,153,417,744원</div>    <div class="stock-profit" id="stockProfit">+900,751,812원 (356.50%)</div>  </div></div><!-- Bottom nav --><div class="bottom-nav">  <div class="nav-item"><div class="nav-icon">☰</div>메뉴</div>  <div class="nav-item"><div class="nav-icon">🏠</div>홈</div>  <div class="nav-item"><div class="nav-icon">♡</div>관심종목</div>  <div class="nav-item"><div class="nav-icon">📈</div>투자NOW</div>  <div class="nav-item active"><div class="nav-icon">🥧</div>MY자산</div></div><script>  const INITIAL_TOTAL = 9046319222;  const INITIAL_STOCK = 1153417744;  const INITIAL_STOCK_COST = INITIAL_STOCK - 900751812; // 매수원가  const ANNUAL_RATE = 0.12;  const START_DATE = new Date('2026-05-21T07:30:00+09:00'); // 기준 시작일  const amountEl = document.getElementById('amount');  const stockAmountEl = document.getElementById('stockAmount');  const stockProfitEl = document.getElementById('stockProfit');  const dateInput = document.getElementById('dateInput');  const futureBadge = document.getElementById('futureBadge');  const clockEl = document.getElementById('clock');  // 이전 변동률 저장 (연속성을 위해)  let prevDeviation = 0;  function formatNumber(n) {    return Math.floor(n).toLocaleString('ko-KR');  }  function getElapsedYears(targetDate) {    const MS_PER_YEAR = 365.25 * 24 * 60 * 60 * 1000;    return (targetDate.getTime() - START_DATE.getTime()) / MS_PER_YEAR;  }  function updateClock() {    const now = new Date();    const h = now.getHours();    const m = String(now.getMinutes()).padStart(2, '0');    clockEl.textContent = `${h}:${m}`;  }  function calculateAndRender() {    const selectedDate = new Date(dateInput.value + 'T07:30:00+09:00');    const years = getElapsedYears(selectedDate);    // 연 12% 복리    const baseTotal = INITIAL_TOTAL * Math.pow(1 + ANNUAL_RATE, years);    const baseStock = INITIAL_STOCK * Math.pow(1 + ANNUAL_RATE, years);    // 랜덤 워크: 이전값 + 작은 변화량    // 변화량은 ±0.15% 범위, 전체 deviation은 ±0.5% 클램프    const delta = (Math.random() - 0.5) * 0.003; // ±0.15%    let newDeviation = prevDeviation + delta;    // 평균회귀: 0에서 멀어질수록 0으로 끌어당김    newDeviation = newDeviation * 0.92;    // ±0.5% 클램프    if (newDeviation > 0.005) newDeviation = 0.005;    if (newDeviation < -0.005) newDeviation = -0.005;    prevDeviation = newDeviation;    const finalTotal = baseTotal * (1 + newDeviation);    const finalStock = baseStock * (1 + newDeviation);    // 자산 표시    amountEl.textContent = formatNumber(finalTotal) + '원';    // 색상 (변동 방향)    amountEl.classList.remove('up', 'down');    if (newDeviation > 0.001) amountEl.classList.add('up');    else if (newDeviation < -0.001) amountEl.classList.add('down');    // 주식 표시    stockAmountEl.textContent = formatNumber(finalStock) + '원';    const stockProfit = finalStock - INITIAL_STOCK_COST;    const stockProfitRate = (stockProfit / INITIAL_STOCK_COST) * 100;    stockProfitEl.textContent = `+${formatNumber(stockProfit)}원 (${stockProfitRate.toFixed(2)}%)`;    // 미래 뱃지    const today = new Date();    today.setHours(0,0,0,0);    const sel = new Date(dateInput.value);    futureBadge.style.display = sel > today ? 'inline-block' : 'none';  }  // 초기 날짜: 오늘  function initDate() {    const today = new Date();    const yyyy = today.getFullYear();    const mm = String(today.getMonth() + 1).padStart(2, '0');    const dd = String(today.getDate()).padStart(2, '0');    dateInput.value = `${yyyy}-${mm}-${dd}`;  }  dateInput.addEventListener('change', () => {    // 날짜 변경 시 deviation 리셋 후 재계산    prevDeviation = (Math.random() - 0.5) * 0.006;    calculateAndRender();  });  // === Pull to refresh ===  let startY = 0;  let currentY = 0;  let pulling = false;  let refreshing = false;  const indicator = document.getElementById('pullIndicator');  const PULL_THRESHOLD = 70;  document.addEventListener('touchstart', (e) => {    if (window.scrollY === 0 && !refreshing) {      startY = e.touches[0].clientY;      pulling = true;    }  }, { passive: true });  document.addEventListener('touchmove', (e) => {    if (!pulling || refreshing) return;    currentY = e.touches[0].clientY;    const diff = currentY - startY;    if (diff > 0 && window.scrollY === 0) {      const pull = Math.min(diff * 0.5, 120);      indicator.style.opacity = Math.min(pull / PULL_THRESHOLD, 1);      indicator.style.transform = `translateX(-50%) translateY(${pull - 60}px)`;      const rotation = (pull / PULL_THRESHOLD) * 360;      indicator.querySelector('svg').style.transform = `rotate(${rotation}deg)`;    }  }, { passive: true });  document.addEventListener('touchend', () => {    if (!pulling || refreshing) return;    const diff = currentY - startY;    if (diff * 0.5 >= PULL_THRESHOLD) {      doRefresh();    } else {      resetIndicator();    }    pulling = false;  });  function doRefresh() {    refreshing = true;    indicator.classList.add('spinning');    indicator.style.transform = 'translateX(-50%) translateY(20px)';    indicator.style.opacity = '1';    setTimeout(() => {      calculateAndRender();      setTimeout(() => {        resetIndicator();        indicator.classList.remove('spinning');        refreshing = false;      }, 300);    }, 600);  }  function resetIndicator() {    indicator.style.opacity = '0';    indicator.style.transform = 'translateX(-50%) translateY(-60px)';  }  // 마우스 드래그도 지원 (데스크탑 테스트용)  let mouseDown = false;  document.addEventListener('mousedown', (e) => {    if (window.scrollY === 0 && !refreshing) {      startY = e.clientY;      mouseDown = true;      pulling = true;    }  });  document.addEventListener('mousemove', (e) => {    if (!mouseDown || !pulling || refreshing) return;    currentY = e.clientY;    const diff = currentY - startY;    if (diff > 0 && window.scrollY === 0) {      const pull = Math.min(diff * 0.5, 120);      indicator.style.opacity = Math.min(pull / PULL_THRESHOLD, 1);      indicator.style.transform = `translateX(-50%) translateY(${pull - 60}px)`;      const rotation = (pull / PULL_THRESHOLD) * 360;      indicator.querySelector('svg').style.transform = `rotate(${rotation}deg)`;    }  });  document.addEventListener('mouseup', () => {    if (!mouseDown) return;    mouseDown = false;    if (!pulling || refreshing) return;    const diff = currentY - startY;    if (diff * 0.5 >= PULL_THRESHOLD) {      doRefresh();    } else {      resetIndicator();    }    pulling = false;  });  // 초기화  initDate();  calculateAndRender();  updateClock();  setInterval(updateClock, 30000);</script></body></html>
